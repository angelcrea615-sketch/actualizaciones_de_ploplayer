<!-- ProPlayer tema: navidad (rico) — se inyecta, no es página completa -->
<style id="pp-tema-style-navidad">
html.tema-navidad {
  --accent: #c41e3a;
  --accent-seasonal: #0f7b3c;
  --bg-main: #070c09;
  --bg-side: #0b120e;
}
html.tema-navidad body { background: radial-gradient(ellipse at top, #122018 0%, #070c09 55%) fixed; }
html.tema-navidad .btn-play-big,
html.tema-navidad .btn-play-bar {
  box-shadow: 0 4px 28px rgba(196, 30, 58, 0.55), 0 0 0 1px rgba(15, 123, 60, 0.25) !important;
}
html.tema-navidad aside.sidebar {
  background:
    linear-gradient(180deg, rgba(15, 123, 60, 0.12) 0%, transparent 120px),
    var(--bg-side) !important;
  box-shadow: inset -1px 0 0 rgba(15, 123, 60, 0.35);
  position: relative;
}
html.tema-navidad aside.sidebar::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: repeating-linear-gradient(
    90deg,
    #c41e3a 0 12px,
    #0f7b3c 12px 24px,
    #f5f5f5 24px 28px,
    #c41e3a 28px 40px
  );
  opacity: 0.9;
  pointer-events: none;
  z-index: 2;
}
html.tema-navidad .album-card:hover {
  box-shadow: 0 10px 32px rgba(15, 123, 60, 0.28), 0 0 0 1px rgba(196, 30, 58, 0.2);
}
html.tema-navidad .nav-link.active {
  background: linear-gradient(90deg, rgba(196, 30, 58, 0.18), rgba(15, 123, 60, 0.12)) !important;
}
html.tema-navidad #home-version-watermark {
  background: linear-gradient(90deg, #c41e3a, #0f7b3c, #c41e3a) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  color: transparent !important;
  opacity: 0.14 !important;
}

.pp-logo-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  user-select: none;
}
.pp-logo-icon {
  position: relative;
  overflow: visible !important;
  transition: filter 0.2s ease;
}
.pp-logo-wrap:hover .pp-logo-icon {
  filter: brightness(1.15) drop-shadow(0 0 8px rgba(196, 30, 58, 0.5));
}

.pp-seasonal-hat {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-40%) rotate(-14deg);
  pointer-events: none;
  z-index: 6;
  filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
  animation: pp-hat-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  animation-delay: 0.9s;
  width: 34px;
  height: 26px;
}
@keyframes pp-hat-pop {
  from {
    opacity: 0;
    transform: translateX(-40%) translateY(-18px) rotate(-30deg) scale(0.4);
  }
  to {
    opacity: 1;
    transform: translateX(-40%) rotate(-14deg) scale(1);
  }
}

.pp-logo-spin-hat .pp-logo-icon {
  animation: pp-logo-flip 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-flip {
  0%   { transform: rotateY(0deg) scale(1); }
  25%  { transform: rotateY(90deg) scale(1.12); }
  50%  { transform: rotateY(180deg) scale(1.06); }
  75%  { transform: rotateY(270deg) scale(1.1); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-logo-flip 1.1s cubic-bezier(0.4, 0.05, 0.5, 1) both;
  transform-style: preserve-3d;
}

html.tema-navidad #loading-screen {
  background: radial-gradient(circle at 50% 30%, #122818 0%, #05070a 70%) !important;
}
.pp-xmas-lights {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  justify-content: center;
}
.pp-xmas-lights span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: pp-bulb 1.4s ease-in-out infinite;
  box-shadow: 0 0 8px currentColor;
}
.pp-xmas-lights span:nth-child(1) { color: #c41e3a; background: #c41e3a; animation-delay: 0s; }
.pp-xmas-lights span:nth-child(2) { color: #0f7b3c; background: #0f7b3c; animation-delay: 0.2s; }
.pp-xmas-lights span:nth-child(3) { color: #f5c542; background: #f5c542; animation-delay: 0.4s; }
.pp-xmas-lights span:nth-child(4) { color: #c41e3a; background: #c41e3a; animation-delay: 0.6s; }
.pp-xmas-lights span:nth-child(5) { color: #0f7b3c; background: #0f7b3c; animation-delay: 0.8s; }
@keyframes pp-bulb {
  0%, 100% { opacity: 0.35; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}

.pp-seasonal-fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 45;
  overflow: hidden;
}
.pp-particle-nieve {
  position: absolute;
  top: -24px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.55));
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.45);
  animation: pp-fall-snow linear forwards;
}
@keyframes pp-fall-snow {
  0%   { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
  6%   { opacity: 1; }
  100% { transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(180deg); opacity: 0.05; }
}
.pp-sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 8px 2px rgba(255, 220, 150, 0.8);
  animation: pp-spark 1.8s ease-out forwards;
  pointer-events: none;
}
@keyframes pp-spark {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(2.5) translateY(-20px); opacity: 0; }
}

html.tema-navidad .search-bar {
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, transparent, #c41e3a, #0f7b3c, #c41e3a, transparent) 1;
}

@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-hat .pp-logo-icon,
  .pp-logo-spin-once .pp-logo-icon,
  .pp-seasonal-hat,
  .pp-particle-nieve,
  .pp-xmas-lights span,
  .pp-sparkle {
    animation: none !important;
  }
}
</style>
<script>
(function () {
  var ID = "navidad";
  var HAT_SVG =
    '<svg viewBox="0 0 72 52" width="34" height="26" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M10 38 C10 18 28 4 42 4 C58 4 66 20 66 34" fill="#b91c1c"/>' +
    '<path d="M8 36 C14 22 30 10 44 10 C56 10 64 22 66 34" fill="#c41e3a"/>' +
    '<ellipse cx="38" cy="38" rx="30" ry="7" fill="#f8fafc"/>' +
    '<ellipse cx="38" cy="36.5" rx="28" ry="5" fill="#e2e8f0"/>' +
    '<circle cx="62" cy="12" r="7" fill="#f8fafc"/>' +
    '<circle cx="62" cy="12" r="4.5" fill="#fee2e2"/>' +
    '</svg>';

  function qsAll(sel) {
    return Array.prototype.slice.call(document.querySelectorAll(sel));
  }

  function markLogos() {
    qsAll("aside.sidebar > div.flex.items-center.gap-3").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("data-pp-logo", "sidebar");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
    qsAll("#auth-screen .auth-card > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("data-pp-logo", "auth");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-10, div.w-8");
      if (icon) icon.classList.add("pp-logo-icon");
    });
    qsAll("#loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("data-pp-logo", "loading");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-10, div.w-8");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }

  function putHats() {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      var icon = w.querySelector(".pp-logo-icon") || w.querySelector("div");
      if (!icon || icon.querySelector(".pp-seasonal-hat")) return;
      icon.style.position = icon.style.position || "relative";
      var hat = document.createElement("span");
      hat.className = "pp-seasonal-hat";
      hat.setAttribute("aria-hidden", "true");
      hat.innerHTML = HAT_SVG;
      icon.appendChild(hat);
    });
  }

  function sparklesAround(el) {
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var layer = document.querySelector(".pp-seasonal-fx-layer") || document.body;
    for (var i = 0; i < 8; i++) {
      var s = document.createElement("span");
      s.className = "pp-sparkle";
      s.style.left = rect.left + rect.width / 2 + (Math.random() - 0.5) * 50 + "px";
      s.style.top = rect.top + rect.height / 2 + (Math.random() - 0.5) * 40 + "px";
      layer.appendChild(s);
      (function (node) {
        setTimeout(function () { if (node.parentNode) node.remove(); }, 2000);
      })(s);
    }
  }

  function spinLogo(wrap) {
    var targets = wrap ? [wrap] : qsAll(".pp-logo-wrap");
    targets.forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      sparklesAround(w.querySelector(".pp-logo-icon") || w);
      setTimeout(function () {
        w.classList.remove("pp-logo-spin-once");
      }, 1200);
    });
  }

  window.__ppTriggerLogoAnim = function (wrap) {
    spinLogo(wrap || null);
  };

  function bindClicks() {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        spinLogo(w);
      });
    });
  }

  function applyColors() {
    var r = document.documentElement;
    r.style.setProperty("--accent", "#c41e3a");
    r.style.setProperty("--bg-main", "#070c09");
    r.style.setProperty("--bg-side", "#0b120e");
  }

  function loadingLights() {
    var ls = document.getElementById("loading-screen");
    if (!ls || ls.querySelector(".pp-xmas-lights")) return;
    var row = document.createElement("div");
    row.className = "pp-xmas-lights";
    row.setAttribute("aria-hidden", "true");
    row.innerHTML = "<span></span><span></span><span></span><span></span><span></span>";
    var ring = ls.querySelector(".loader-ring");
    if (ring && ring.parentNode) ring.parentNode.insertBefore(row, ring.nextSibling);
    else ls.appendChild(row);
  }

  function snow() {
    var layer = document.querySelector(".pp-seasonal-fx-layer");
    if (!layer) {
      layer = document.createElement("div");
      layer.className = "pp-seasonal-fx-layer";
      layer.setAttribute("aria-hidden", "true");
      document.body.appendChild(layer);
    }
    function flake() {
      if (document.hidden) return;
      if (layer.querySelectorAll(".pp-particle-nieve").length > 55) return;
      var p = document.createElement("span");
      p.className = "pp-particle-nieve";
      var size = 2.5 + Math.random() * 7;
      p.style.left = Math.random() * 100 + "%";
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.setProperty("--drift", (Math.random() * 80 - 20) + "px");
      p.style.animationDuration = (7 + Math.random() * 10) + "s";
      p.style.animationDelay = Math.random() * 1.5 + "s";
      p.style.opacity = String(0.5 + Math.random() * 0.5);
      layer.appendChild(p);
      setTimeout(function () { if (p.parentNode) p.remove(); }, 18000);
    }
    for (var i = 0; i < 18; i++) flake();
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    window.__ppSnowTimer = setInterval(flake, 480);
  }

  markLogos();
  applyColors();
  putHats();
  bindClicks();
  loadingLights();
  snow();

  setTimeout(function () {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      w.classList.add("pp-logo-spin-hat");
      setTimeout(function () { w.classList.remove("pp-logo-spin-hat"); }, 1400);
    });
  }, 600);

  if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
  window.__ppLogoRepeat = setInterval(function () {
    if (typeof window.__ppTriggerLogoAnim === "function") window.__ppTriggerLogoAnim();
  }, 8 * 60 * 1000);

  if (window.__ppLogoObserver) {
    try { window.__ppLogoObserver.disconnect(); } catch (e) {}
  }
  window.__ppLogoObserver = new MutationObserver(function () {
    markLogos();
    putHats();
    bindClicks();
  });
  window.__ppLogoObserver.observe(document.body, { childList: true, subtree: true });

  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
    if (window.__ppLogoObserver) {
      try { window.__ppLogoObserver.disconnect(); } catch (e2) {}
    }
    qsAll(".pp-seasonal-hat, .pp-seasonal-fx-layer, .pp-xmas-lights, .pp-sparkle").forEach(function (e) {
      e.remove();
    });
    qsAll(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
