<!-- Navidad: Árbol interactivo (5 modos), regalos premium, más nieve, cero emojis y contadores superiores estilizados y grandes -->
<style id="pp-tema-style-navidad">
html.tema-navidad {
  --accent: #d4243b;
  --accent-glow: rgba(212, 36, 59, 0.5);
  --bg-main: #050a07;
  --bg-side: #0a130e;
  --bg-secondary: #163022;
  --glass-border: rgba(13, 138, 69, 0.3);
}
html.tema-navidad body {
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, rgba(13,138,69,0.2) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(212,36,59,0.12) 0%, transparent 50%),
    var(--bg-main) !important;
}
html.tema-navidad aside.sidebar {
  background: linear-gradient(180deg, rgba(13,138,69,0.14) 0%, transparent 120px), var(--bg-side) !important;
  border-right: 1px solid rgba(13, 138, 69, 0.35) !important;
}
html.tema-navidad .nav-link.active {
  background: linear-gradient(90deg, rgba(212,36,59,0.28), rgba(13,138,69,0.15)) !important;
  box-shadow: inset 3px 0 0 #d4243b;
}
html.tema-navidad .nav-link.active .nav-icon { color: #d4243b !important; }
html.tema-navidad .main-content {
  background: linear-gradient(180deg, rgba(18,40,28,0.95) 0%, var(--bg-main) 420px) !important;
}
html.tema-navidad .album-card {
  background: rgba(18, 40, 28, 0.65) !important;
  border: 1px solid rgba(13,138,69,0.25);
  transition: all 0.3s ease;
}
html.tema-navidad .album-card:hover {
  border-color: rgba(212,36,59,0.5);
  box-shadow: 0 14px 36px rgba(13,138,69,0.3);
  transform: translateY(-4px);
}
html.tema-navidad .card-play-btn, html.tema-navidad .btn-play-big {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
  box-shadow: 0 6px 24px rgba(212,36,59,0.5) !important;
}
html.tema-navidad .player-bar {
  background: rgba(6, 12, 9, 0.96) !important;
  border-top: 1px solid rgba(13,138,69,0.35) !important;
}
html.tema-navidad .btn-play-bar {
  background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
  color: #14532d !important;
}
html.tema-navidad #seek-slider {
  background: linear-gradient(to right, #d4243b var(--seek-progress), #1a3024 var(--seek-progress)) !important;
}
html.tema-navidad #volume-slider {
  background: linear-gradient(to right, #0d8a45 var(--volume-progress), #1a3024 var(--volume-progress)) !important;
}
html.tema-navidad #auth-screen {
  background: radial-gradient(ellipse at 50% 20%, rgba(13,138,69,0.22), transparent 50%), #050a07 !important;
}
html.tema-navidad .auth-btn { background: linear-gradient(135deg, #d4243b, #a01a2e) !important; }
html.tema-navidad #loading-screen {
  background: radial-gradient(circle at 50% 35%, #153528 0%, #050a07 65%) !important;
}
html.tema-navidad .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #0d8a45, #d4243b) !important;
}
html.tema-navidad .pp-logo-icon,
html.tema-navidad aside.sidebar .w-8,
html.tema-navidad #auth-screen .w-10,
html.tema-navidad #loading-screen .w-10 {
  background: linear-gradient(135deg, #d4243b, #0d8a45) !important;
}
.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; }
.pp-logo-icon { position: relative; overflow: visible !important; }

.pp-seasonal-hat {
  position: absolute; top: -18px; left: 50%;
  transform: translateX(-42%) rotate(-12deg);
  pointer-events: none; z-index: 6;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
  animation: pp-hat-pop .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .5s; width: 36px; height: 28px;
}
@keyframes pp-hat-pop {
  from { opacity: 0; transform: translateX(-42%) translateY(-16px) rotate(-30deg) scale(.3); }
  to   { opacity: 1; transform: translateX(-42%) rotate(-12deg) scale(1); }
}

.pp-lights-overlay {
  position: fixed; top: 0; right: 0; bottom: 0;
  left: var(--pp-sidebar-w, 220px);
  pointer-events: none; z-index: 43;
}
.pp-light-strip {
  position: absolute; left: 8px; right: 8px; height: 16px;
  pointer-events: none; overflow: visible;
}
.pp-light-strip.top { top: 4px; }
.pp-light-strip.bottom { bottom: 4px; }
.pp-light-strip svg { width: 100%; height: 16px; display: block; }
.pp-fx-screen {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 42;
}
.pp-particle-nieve {
  position: absolute; top: -16px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.65));
  animation: pp-fall-snow linear forwards;
  will-change: transform;
}
@keyframes pp-fall-snow {
  0% { transform: translate3d(0,0,0); opacity: 0; }
  8% { opacity: 1; }
  100% { transform: translate3d(var(--drift,28px), 110vh, 0); opacity: .12; }
}

/* Árbol en esquina inferior derecha */
.pp-xmas-tree {
  position: fixed;
  right: 24px;
  bottom: 25px;
  z-index: 40;
  cursor: pointer;
  pointer-events: auto !important;
  filter: drop-shadow(0 14px 32px rgba(0,0,0,0.8));
  transition: transform 0.2s ease;
  animation: pp-tree-in 0.9s cubic-bezier(.34,1.4,.64,1) both;
}
.pp-xmas-tree:hover { transform: scale(1.02); }

@keyframes pp-tree-in {
  from { opacity: 0; transform: translateY(30px) scale(.8); }
  to { opacity: 1; transform: none; }
}
.pp-xmas-tree .star-glow {
  animation: pp-star-pulse 1.8s ease-in-out infinite;
  transform-origin: center;
}
@keyframes pp-star-pulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 14px #f5c542); }
}

/* --- CONTADORES SUPERIORES ESTILIZADOS Y GRANDES --- */
.pp-top-counters-bar {
  position: fixed;
  top: 16px;
  right: 24px;
  z-index: 45;
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
.pp-top-counter-box {
  background: rgba(8, 20, 13, 0.92);
  border: 1px solid rgba(13, 138, 69, 0.35);
  border-radius: 12px;
  padding: 8px 14px;
  text-align: center;
  backdrop-filter: blur(8px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  min-width: 175px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.pp-top-counter-box:hover {
  transform: translateY(-2px);
  border-color: rgba(212, 36, 59, 0.5);
}
.pp-top-counter-box.newyear {
  border-color: rgba(245, 197, 66, 0.35);
  background: rgba(14, 14, 22, 0.92);
}
.pp-top-counter-box.newyear:hover {
  border-color: rgba(245, 197, 66, 0.7);
}
.pp-top-counter-title {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  color: #34d399;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.pp-top-counter-box.newyear .pp-top-counter-title {
  color: #f5c542;
}
.pp-top-counter-time {
  font-size: 14px;
  font-weight: 700;
  color: #f8fafc;
  font-family: monospace;
  letter-spacing: .02em;
}

/* Modos de iluminación del árbol */
.pp-xmas-tree.modo-1 .bulb-dynamic { animation: colorCycle 4s infinite linear; }
.pp-xmas-tree.modo-2 .bulb-dynamic { animation: lightBlinkFast 0.4s infinite alternate; }
.pp-xmas-tree.modo-3 .bulb-dynamic { animation: none; opacity: 1; filter: drop-shadow(0 0 8px #ffffff); fill: #ffffff; }
.pp-xmas-tree.modo-4 .bulb-dynamic { animation: partyDisco 0.8s infinite steps(1); }
.pp-xmas-tree.modo-5 .bulb-dynamic { animation: waveGlow 2s infinite ease-in-out; }

@keyframes colorCycle {
  0% { fill: #d4243b; filter: drop-shadow(0 0 5px #d4243b); }
  33% { fill: #f5c542; filter: drop-shadow(0 0 5px #f5c542); }
  66% { fill: #38bdf8; filter: drop-shadow(0 0 5px #38bdf8); }
  100% { fill: #22c55e; filter: drop-shadow(0 0 5px #22c55e); }
}
@keyframes lightBlinkFast {
  0% { opacity: 0.2; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.35); filter: drop-shadow(0 0 10px #f5c542); }
}
@keyframes partyDisco {
  0% { fill: #ef4444; filter: drop-shadow(0 0 6px #ef4444); }
  25% { fill: #3b82f6; filter: drop-shadow(0 0 6px #3b82f6); }
  50% { fill: #eab308; filter: drop-shadow(0 0 6px #eab308); }
  75% { fill: #ec4899; filter: drop-shadow(0 0 6px #ec4899); }
  100% { fill: #22c55e; filter: drop-shadow(0 0 6px #22c55e); }
}
@keyframes waveGlow {
  0%, 100% { opacity: 0.3; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 10px #38bdf8); }
}
</style>
<script>
(function () {
  var ID = "navidad";
  var COLORS = ["#d4243b", "#0d8a45", "#f5c542", "#ffffff"];
  var HAT =
    '<svg viewBox="0 0 72 52" width="36" height="28" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M10 38 C10 18 28 4 42 4 C58 4 66 20 66 34" fill="#b91c1c"/>' +
    '<path d="M8 36 C14 22 30 10 44 10 C56 10 64 22 66 34" fill="#d4243b"/>' +
    '<ellipse cx="38" cy="38" rx="30" ry="7" fill="#f8fafc"/>' +
    '<circle cx="62" cy="12" r="7" fill="#f8fafc"/></svg>';

  function runNavidadTheme() {
    function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
    
    function markLogos() {
      $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
        if (!el.classList.contains("pp-logo-wrap")) {
          el.classList.add("pp-logo-wrap");
          el.setAttribute("title", "ProPlayer Navidad");
        }
        var icon = el.querySelector("div.w-8, div.w-10");
        if (icon && !icon.classList.contains("pp-logo-icon")) {
          icon.classList.add("pp-logo-icon");
        }
      });
    }

    function putHats() {
      $(".pp-logo-wrap").forEach(function (w) {
        var icon = w.querySelector(".pp-logo-icon") || w.querySelector("div");
        if (!icon || icon.querySelector(".pp-seasonal-hat")) return;
        icon.style.position = icon.style.position || "relative";
        var h = document.createElement("span");
        h.className = "pp-seasonal-hat";
        h.innerHTML = HAT;
        icon.appendChild(h);
      });
    }

    function sidebarWidth() {
      var side = document.querySelector("aside.sidebar");
      if (!side || side.offsetParent === null) return 0;
      return Math.ceil(side.getBoundingClientRect().width) || 220;
    }

    function makeStripSVG(colors, count) {
      count = count || 22;
      var parts = ['<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1000 16">'];
      parts.push('<path d="M0 9 Q 125 5 250 9 T 500 9 T 750 9 T 1000 9" fill="none" stroke="rgba(200,200,200,0.4)" stroke-width="1.3"/>');
      for (var i = 0; i < count; i++) {
        var x = 18 + (i / (count - 1)) * 964;
        var y = 9 + Math.sin((i / (count - 1)) * Math.PI * 2) * 1.2;
        var c = colors[i % colors.length];
        var delay = (i * 0.1).toFixed(2);
        parts.push('<circle cx="'+x+'" cy="'+y+'" r="3.4" fill="'+c+'">');
        parts.push('<animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="'+delay+'s" repeatCount="indefinite"/>');
        parts.push('</circle>');
      }
      parts.push('</svg>');
      return parts.join('');
    }

    function placeLights() {
      document.documentElement.style.setProperty("--pp-sidebar-w", sidebarWidth() + "px");
      var ov = document.querySelector(".pp-lights-overlay");
      if (!ov) {
        ov = document.createElement("div");
        ov.className = "pp-lights-overlay";
        document.body.appendChild(ov);
      }
      ov.innerHTML = "";
      var top = document.createElement("div");
      top.className = "pp-light-strip top";
      top.innerHTML = makeStripSVG(COLORS, 24);
      ov.appendChild(top);
      var bot = document.createElement("div");
      bot.className = "pp-light-strip bottom";
      bot.innerHTML = makeStripSVG(COLORS.slice().reverse(), 22);
      ov.appendChild(bot);
    }

    function placeTopCounters() {
      if (document.querySelector(".pp-top-counters-bar")) return;
      var bar = document.createElement("div");
      bar.className = "pp-top-counters-bar";
      bar.innerHTML =
        '<div class="pp-top-counter-box">' +
          '<div class="pp-top-counter-title">Navidad</div>' +
          '<div id="pp-timer-xmas" class="pp-top-counter-time">--d --h --m --s</div>' +
        '</div>' +
        '<div class="pp-top-counter-box newyear">' +
          '<div class="pp-top-counter-title">Año Nuevo</div>' +
          '<div id="pp-timer-newyear" class="pp-top-counter-time">--d --h --m --s</div>' +
        '</div>';
      document.body.appendChild(bar);
      iniciarContadoresNavidad();
    }

    function placeTree() {
      if (document.querySelector(".pp-xmas-tree")) return;
      var el = document.createElement("div");
      el.className = "pp-xmas-tree modo-1";
      el.setAttribute("title", "¡Haz clic en el árbol para cambiar sus luces!");
      
      el.innerHTML =
        '<svg width="145" height="195" viewBox="0 0 145 195" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<linearGradient id="treeGradBig" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#34d399"/>' +
            '<stop offset="45%" stop-color="#059669"/>' +
            '<stop offset="100%" stop-color="#064e21"/>' +
          '</linearGradient>' +
          '<linearGradient id="giftRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>' +
          '<linearGradient id="giftBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>' +
          '<linearGradient id="giftGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>' +
          '<linearGradient id="giftPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>' +
        '</defs>' +

        /* Árbol frondoso y orgánico */
        '<path d="M72 8 Q88 38 103 52 Q115 60 105 70 Q122 90 112 102 Q128 125 115 140 Q135 165 122 175 L22 175 Q9 165 28 140 Q16 125 32 102 Q22 90 39 70 Q29 60 41 52 Q56 38 72 8 Z" fill="url(#treeGradBig)" stroke="#064e21" stroke-width="1.8"/>' +
        '<rect x="61" y="175" width="22" height="16" rx="3" fill="#451a03"/>' +
        
        /* Regalos premium al pie */
        '<ellipse cx="72" cy="191" rx="42" ry="3" fill="rgba(0,0,0,0.55)"/>' +
        '<rect x="24" y="182" width="20" height="11" rx="2" fill="url(#giftPurple)"/>' +
        '<rect x="32" y="182" width="4" height="11" fill="#f8fafc"/>' +
        '<rect x="54" y="174" width="30" height="19" rx="2.5" fill="url(#giftBlue)"/>' +
        '<rect x="67" y="174" width="5" height="19" fill="#e2e8f0"/>' +
        '<rect x="54" y="183" width="30" height="4" fill="#e2e8f0"/>' +
        '<path d="M63 174 C59 168 67 168 69 174 Z" fill="#cbd5e1"/>' +
        '<path d="M72 174 C76 168 70 168 69 174 Z" fill="#cbd5e1"/>' +
        '<circle cx="69" cy="174" r="2" fill="#ffffff"/>' +
        '<rect x="86" y="177" width="25" height="16" rx="2" fill="url(#giftGold)"/>' +
        '<rect x="97" y="177" width="4.5" height="16" fill="#ef4444"/>' +
        '<rect x="86" y="184" width="25" height="3.5" fill="#ef4444"/>' +
        '<rect x="42" y="179" width="24" height="14" rx="2" fill="url(#giftRed)"/>' +
        '<rect x="52" y="179" width="4" height="14" fill="#fde047"/>' +
        '<rect x="42" y="185" width="24" height="3" fill="#fde047"/>' +
        '<rect x="45" y="170" width="16" height="10" rx="1.5" fill="url(#giftGold)"/>' +
        '<rect x="51" y="170" width="3" height="10" fill="#dc2626"/>' +

        /* Estrella superior */
        '<polygon class="star-glow" points="72,0 74,5 80,6 75,11 77,17 72,13 67,17 69,11 64,6 70,5" fill="#f5c542"/>' +
        
        /* Luces */
        '<circle class="bulb-dynamic" cx="72" cy="32" r="5" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="56" cy="58" r="5" fill="#f5c542"/>' +
        '<circle class="bulb-dynamic" cx="88" cy="65" r="5" fill="#38bdf8"/>' +
        '<circle class="bulb-dynamic" cx="42" cy="92" r="5" fill="#22c55e"/>' +
        '<circle class="bulb-dynamic" cx="72" cy="98" r="5" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="100" cy="90" r="5" fill="#f5c542"/>' +
        '<circle class="bulb-dynamic" cx="32" cy="130" r="5" fill="#38bdf8"/>' +
        '<circle class="bulb-dynamic" cx="58" cy="138" r="5" fill="#22c55e"/>' +
        '<circle class="bulb-dynamic" cx="84" cy="132" r="5" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="110" cy="142" r="5" fill="#f5c542"/>' +
        '</svg>';

      // Evento interactivo para cambiar los 5 modos de luces
      var modoActual = 1;
      el.addEventListener("click", function () {
        el.classList.remove("modo-" + modoActual);
        modoActual = modoActual >= 5 ? 1 : modoActual + 1;
        el.classList.add("modo-" + modoActual);
      });

      document.body.appendChild(el);
    }

    function iniciarContadoresNavidad() {
      function actualizar() {
        var ahora = new Date();
        var anioActual = ahora.getFullYear();

        var navidad = new Date(anioActual, 11, 25, 0, 0, 0);
        if (ahora > navidad) {
          navidad = new Date(anioActual + 1, 11, 25, 0, 0, 0);
        }
        var diffNavidad = navidad - ahora;

        var anoNuevo = new Date(anioActual + 1, 0, 1, 0, 0, 0);
        var diffAnioNuevo = anoNuevo - ahora;

        function formatearTiempo(ms) {
          if (ms <= 0) return "¡Llegó!";
          var d = Math.floor(ms / (1000 * 60 * 60 * 24));
          var h = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          var m = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
          var s = Math.floor((ms % (1000 * 60)) / 1000);
          return d + "d " + h + "h " + m + "m " + s + "s";
        }

        var elXmas = document.getElementById("pp-timer-xmas");
        var elNewYear = document.getElementById("pp-timer-newyear");

        if (elXmas) elXmas.textContent = formatearTiempo(diffNavidad);
        if (elNewYear) elNewYear.textContent = formatearTiempo(diffAnioNuevo);
      }

      actualizar();
      if (window.__ppTimerInterval) clearInterval(window.__ppTimerInterval);
      window.__ppTimerInterval = setInterval(actualizar, 1000);
    }

    function snow() {
      var layer = document.querySelector(".pp-fx-screen");
      if (!layer) {
        layer = document.createElement("div");
        layer.className = "pp-fx-screen";
        document.body.appendChild(layer);
      }
      function flake() {
        if (document.hidden) return;
        if (layer.querySelectorAll(".pp-particle-nieve").length > 60) return;
        var p = document.createElement("span");
        p.className = "pp-particle-nieve";
        var size = 2 + Math.random() * 6;
        p.style.left = Math.random() * 100 + "%";
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.setProperty("--drift", (Math.random() * 70 - 25) + "px");
        p.style.animationDuration = (6 + Math.random() * 10) + "s";
        layer.appendChild(p);
        setTimeout(function () { p.remove(); }, 16000);
      }
      for (var i = 0; i < 20; i++) flake();
      if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
      window.__ppSnowTimer = setInterval(flake, 250);
    }

    markLogos();
    putHats();
    placeLights();
    placeTopCounters();
    placeTree();
    snow();

    if (!window.__ppNavidadObserver) {
      window.__ppNavidadObserver = new MutationObserver(function () {
        markLogos();
        putHats();
      });
      window.__ppNavidadObserver.observe(document.body, { childList: true, subtree: true });
    }
  }

  runNavidadTheme();
  setTimeout(runNavidadTheme, 300);
  setTimeout(runNavidadTheme, 800);

  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    if (window.__ppTimerInterval) clearInterval(window.__ppTimerInterval);
    if (window.__ppNavidadObserver) {
      try { window.__ppNavidadObserver.disconnect(); } catch (e) {}
      window.__ppNavidadObserver = null;
    }
    document.querySelectorAll(".pp-seasonal-hat, .pp-fx-screen, .pp-lights-overlay, .pp-xmas-tree, .pp-top-counters-bar").forEach(function (e) { e.remove(); });
  };
})();
</script>
