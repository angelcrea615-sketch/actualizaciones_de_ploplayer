<!-- Navidad optimizada v2: luces independientes + nieve Canvas -->
<style id="pp-tema-style-navidad">
html.tema-navidad {
  --accent: #d4243b;
  --accent-glow: rgba(212, 36, 59, 0.5);
  --bg-main: #050a07;
  --bg-side: #0a130e;
  --bg-secondary: #163022;
  --glass-border: rgba(13, 138, 69, 0.3);
}
html.tema-navidad body {
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, rgba(13,138,69,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(212,36,59,0.10) 0%, transparent 50%),
    var(--bg-main) !important;
}
html.tema-navidad aside.sidebar {
  background: linear-gradient(180deg, rgba(13,138,69,0.12) 0%, transparent 120px), var(--bg-side) !important;
  border-right: 1px solid rgba(13, 138, 69, 0.3) !important;
}
html.tema-navidad .nav-link.active {
  background: linear-gradient(90deg, rgba(212,36,59,0.25), rgba(13,138,69,0.12)) !important;
  box-shadow: inset 3px 0 0 #d4243b;
}
html.tema-navidad .nav-link.active .nav-icon { color: #d4243b !important; }
html.tema-navidad .main-content {
  background: linear-gradient(180deg, rgba(18,40,28,0.92) 0%, var(--bg-main) 420px) !important;
}
html.tema-navidad .album-card {
  background: rgba(18, 40, 28, 0.6) !important;
  border: 1px solid rgba(13,138,69,0.22);
  transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
}
html.tema-navidad .album-card:hover {
  border-color: rgba(212,36,59,0.45);
  box-shadow: 0 10px 28px rgba(13,138,69,0.22);
  transform: translateY(-3px);
}
html.tema-navidad .card-play-btn,
html.tema-navidad .btn-play-big {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
  box-shadow: 0 4px 18px rgba(212,36,59,0.4) !important;
}
html.tema-navidad .player-bar {
  background: rgba(6, 12, 9, 0.96) !important;
  border-top: 1px solid rgba(13,138,69,0.3) !important;
}
html.tema-navidad .btn-play-bar {
  background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
  color: #14532d !important;
}
html.tema-navidad #seek-slider {
  background: linear-gradient(to right, #d4243b var(--seek-progress), #1a3024 var(--seek-progress)) !important;
}
html.tema-navidad #volume-slider {
  background: linear-gradient(to right, #0d8a45 var(--volume-progress), #1a3024 var(--volume-progress)) !important;
}
html.tema-navidad #auth-screen {
  background: radial-gradient(ellipse at 50% 20%, rgba(13,138,69,0.2), transparent 50%), #050a07 !important;
}
html.tema-navidad .auth-btn { background: linear-gradient(135deg, #d4243b, #a01a2e) !important; }
html.tema-navidad #loading-screen {
  background: radial-gradient(circle at 50% 35%, #153528 0%, #050a07 65%) !important;
}
html.tema-navidad .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #0d8a45, #d4243b) !important;
}
html.tema-navidad .pp-logo-icon,
html.tema-navidad aside.sidebar .w-8,
html.tema-navidad #auth-screen .w-10,
html.tema-navidad #loading-screen .w-10 {
  background: linear-gradient(135deg, #d4243b, #0d8a45) !important;
}

.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; }
.pp-logo-icon { position: relative; overflow: visible !important; }

.pp-seasonal-hat {
  position: absolute; top: -18px; left: 50%;
  transform: translateX(-42%) rotate(-12deg);
  pointer-events: none; z-index: 6;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45));
  animation: pp-hat-pop .55s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .4s; width: 34px; height: 26px;
}
@keyframes pp-hat-pop {
  from { opacity: 0; transform: translateX(-42%) translateY(-14px) rotate(-28deg) scale(.35); }
  to   { opacity: 1; transform: translateX(-42%) rotate(-12deg) scale(1); }
}

.pp-lights-overlay {
  position: fixed; top: 0; right: 0; bottom: 0;
  left: var(--pp-sidebar-w, 220px);
  pointer-events: none; z-index: 43;
}
.pp-light-strip {
  position: absolute; left: 6px; right: 6px; height: 16px;
  pointer-events: none; overflow: visible;
}
.pp-light-strip.top { top: 3px; }
.pp-light-strip.bottom { bottom: 3px; }
.pp-light-strip svg { width: 100%; height: 16px; display: block; }

/* Canvas de nieve (un solo elemento) */
.pp-snow-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 42;
}

/* Árbol */
.pp-xmas-tree {
  position: fixed;
  right: 22px;
  bottom: 100px;
  z-index: 35;
  cursor: pointer;
  pointer-events: auto !important;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,0.65));
  transition: transform 0.2s ease;
  animation: pp-tree-in 0.8s cubic-bezier(.34,1.4,.64,1) both;
  contain: layout style;
}
.pp-xmas-tree:hover { transform: scale(1.025); }

@keyframes pp-tree-in {
  from { opacity: 0; transform: translateY(24px) scale(.85); }
  to   { opacity: 1; transform: none; }
}
.pp-xmas-tree .star-glow {
  animation: pp-star-pulse 2s ease-in-out infinite;
  transform-origin: center;
}
@keyframes pp-star-pulse {
  0%, 100% { opacity: 0.65; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.28); }
}

/* Contadores */
.pp-top-counters-bar {
  position: fixed;
  top: 14px;
  right: 20px;
  z-index: 45;
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
.pp-top-counter-box {
  background: linear-gradient(135deg, rgba(6, 40, 22, 0.94), rgba(4, 20, 11, 0.94));
  border: 2px solid rgba(212, 36, 59, 0.55);
  border-radius: 12px;
  padding: 8px 14px;
  text-align: center;
  backdrop-filter: blur(8px);
  box-shadow: 0 6px 18px rgba(212, 36, 59, 0.2);
  min-width: 180px;
  transition: transform 0.2s ease;
}
.pp-top-counter-box:hover { transform: translateY(-2px); }
.pp-top-counter-box.newyear {
  background: linear-gradient(135deg, rgba(20, 18, 35, 0.94), rgba(8, 8, 16, 0.94));
  border-color: rgba(245, 197, 66, 0.65);
  box-shadow: 0 6px 18px rgba(245, 197, 66, 0.2);
}
.pp-top-counter-title {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  color: #fca5a5;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.pp-top-counter-box.newyear .pp-top-counter-title { color: #fde047; }
.pp-top-counter-time {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  font-family: monospace;
  letter-spacing: .02em;
}

/* Modos del árbol - cada bombilla tiene color independiente */
.pp-xmas-tree.modo-1 .bulb-dynamic { animation: colorCycle 4.5s infinite linear; }
.pp-xmas-tree.modo-2 .bulb-dynamic { animation: lightBlinkFast 0.5s infinite alternate; }
.pp-xmas-tree.modo-3 .bulb-dynamic { animation: none; opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 6px #fff); }
.pp-xmas-tree.modo-4 .bulb-dynamic { animation: partyDisco 0.9s infinite steps(1); }
.pp-xmas-tree.modo-5 .bulb-dynamic { animation: waveGlow 2.2s infinite ease-in-out; }

/* Cada bombilla empieza en un color distinto gracias a animation-delay */
.pp-xmas-tree .bulb-dynamic:nth-child(1)  { animation-delay: 0.0s; }
.pp-xmas-tree .bulb-dynamic:nth-child(2)  { animation-delay: 0.3s; }
.pp-xmas-tree .bulb-dynamic:nth-child(3)  { animation-delay: 0.6s; }
.pp-xmas-tree .bulb-dynamic:nth-child(4)  { animation-delay: 0.9s; }
.pp-xmas-tree .bulb-dynamic:nth-child(5)  { animation-delay: 1.2s; }
.pp-xmas-tree .bulb-dynamic:nth-child(6)  { animation-delay: 1.5s; }
.pp-xmas-tree .bulb-dynamic:nth-child(7)  { animation-delay: 0.2s; }
.pp-xmas-tree .bulb-dynamic:nth-child(8)  { animation-delay: 0.5s; }
.pp-xmas-tree .bulb-dynamic:nth-child(9)  { animation-delay: 0.8s; }
.pp-xmas-tree .bulb-dynamic:nth-child(10) { animation-delay: 1.1s; }

@keyframes colorCycle {
  0%   { fill: #d4243b; }
  25%  { fill: #f5c542; }
  50%  { fill: #38bdf8; }
  75%  { fill: #22c55e; }
  100% { fill: #d4243b; }
}
@keyframes lightBlinkFast {
  0%   { opacity: 0.2; transform: scale(0.8); }
  100% { opacity: 1;   transform: scale(1.3); }
}
@keyframes partyDisco {
  0%   { fill: #ef4444; }
  20%  { fill: #3b82f6; }
  40%  { fill: #eab308; }
  60%  { fill: #ec4899; }
  80%  { fill: #22c55e; }
  100% { fill: #ef4444; }
}
@keyframes waveGlow {
  0%, 100% { opacity: 0.3; transform: scale(0.9); }
  50%      { opacity: 1;   transform: scale(1.25); }
}

@media (prefers-reduced-motion: reduce) {
  .pp-xmas-tree .bulb-dynamic,
  .pp-xmas-tree .star-glow,
  .pp-seasonal-hat {
    animation: none !important;
  }
  .pp-snow-canvas { display: none !important; }
}
</style>

<script>
(function () {
  var ID = "navidad";
  var COLORS = ["#d4243b", "#0d8a45", "#f5c542", "#ffffff", "#38bdf8", "#ec4899"];
  var HAT =
    '<svg viewBox="0 0 72 52" width="34" height="26" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M10 38 C10 18 28 4 42 4 C58 4 66 20 66 34" fill="#b91c1c"/>' +
    '<path d="M8 36 C14 22 30 10 44 10 C56 10 64 22 66 34" fill="#d4243b"/>' +
    '<ellipse cx="38" cy="38" rx="30" ry="7" fill="#f8fafc"/>' +
    '<circle cx="62" cy="12" r="7" fill="#f8fafc"/></svg>';

  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function runNavidadTheme() {
    function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

    function markLogos() {
      $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
        if (!el.classList.contains("pp-logo-wrap")) {
          el.classList.add("pp-logo-wrap");
          el.setAttribute("title", "ProPlayer Navidad");
        }
        var icon = el.querySelector("div.w-8, div.w-10");
        if (icon && !icon.classList.contains("pp-logo-icon")) {
          icon.classList.add("pp-logo-icon");
        }
      });
    }

    function putHats() {
      $(".pp-logo-wrap").forEach(function (w) {
        var icon = w.querySelector(".pp-logo-icon") || w.querySelector("div");
        if (!icon || icon.querySelector(".pp-seasonal-hat")) return;
        icon.style.position = icon.style.position || "relative";
        var h = document.createElement("span");
        h.className = "pp-seasonal-hat";
        h.innerHTML = HAT;
        icon.appendChild(h);
      });
    }

    function sidebarWidth() {
      var side = document.querySelector("aside.sidebar");
      if (!side || side.offsetParent === null) return 0;
      return Math.ceil(side.getBoundingClientRect().width) || 220;
    }

    // Luces con color independiente por bombilla
    function makeStripSVG(colors, count) {
      count = count || 18;
      var parts = ['<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1000 16">'];
      parts.push('<path d="M0 9 Q 125 5 250 9 T 500 9 T 750 9 T 1000 9" fill="none" stroke="rgba(200,200,200,0.35)" stroke-width="1.2"/>');
      
      for (var i = 0; i < count; i++) {
        var x = 18 + (i / (count - 1)) * 964;
        var y = 9 + Math.sin((i / (count - 1)) * Math.PI * 2) * 1.3;
        var c = colors[i % colors.length];
        var delay = (i * 0.15).toFixed(2);
        var dur = (1.4 + (i % 4) * 0.25).toFixed(2); // duración ligeramente diferente
        
        parts.push('<circle cx="'+x+'" cy="'+y+'" r="3.3" fill="'+c+'">');
        parts.push('<animate attributeName="opacity" values="0.3;1;0.3" dur="'+dur+'s" begin="'+delay+'s" repeatCount="indefinite"/>');
        // ligero cambio de color independiente
        parts.push('<animate attributeName="fill" values="'+c+';'+colors[(i+2)%colors.length]+';'+c+'" dur="'+(3+i%3)+'s" begin="'+delay+'s" repeatCount="indefinite"/>');
        parts.push('</circle>');
      }
      parts.push('</svg>');
      return parts.join('');
    }

    function placeLights() {
      document.documentElement.style.setProperty("--pp-sidebar-w", sidebarWidth() + "px");
      var ov = document.querySelector(".pp-lights-overlay");
      if (!ov) {
        ov = document.createElement("div");
        ov.className = "pp-lights-overlay";
        document.body.appendChild(ov);
      }
      ov.innerHTML = "";
      
      var top = document.createElement("div");
      top.className = "pp-light-strip top";
      top.innerHTML = makeStripSVG(COLORS, 18);
      ov.appendChild(top);
      
      var bot = document.createElement("div");
      bot.className = "pp-light-strip bottom";
      bot.innerHTML = makeStripSVG(COLORS.slice().reverse(), 16);
      ov.appendChild(bot);
    }

    function placeTopCounters() {
      if (document.querySelector(".pp-top-counters-bar")) return;
      var bar = document.createElement("div");
      bar.className = "pp-top-counters-bar";
      bar.innerHTML =
        '<div class="pp-top-counter-box">' +
          '<div class="pp-top-counter-title">Falta para Navidad</div>' +
          '<div id="pp-timer-xmas" class="pp-top-counter-time">--d --h --m --s</div>' +
        '</div>' +
        '<div class="pp-top-counter-box newyear">' +
          '<div class="pp-top-counter-title">Falta para Año Nuevo</div>' +
          '<div id="pp-timer-newyear" class="pp-top-counter-time">--d --h --m --s</div>' +
        '</div>';
      document.body.appendChild(bar);
      iniciarContadoresNavidad();
    }

    function placeTree() {
      if (document.querySelector(".pp-xmas-tree")) return;
      var el = document.createElement("div");
      el.className = "pp-xmas-tree modo-1";
      el.setAttribute("title", "¡Haz clic en el árbol para cambiar sus luces!");

      el.innerHTML =
        '<svg width="140" height="190" viewBox="0 0 145 195" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<linearGradient id="treeGradBig" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#34d399"/><stop offset="45%" stop-color="#059669"/><stop offset="100%" stop-color="#064e21"/>' +
          '</linearGradient>' +
          '<linearGradient id="giftRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>' +
          '<linearGradient id="giftBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>' +
          '<linearGradient id="giftGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>' +
          '<linearGradient id="giftPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>' +
        '</defs>' +
        '<path d="M72 8 Q88 38 103 52 Q115 60 105 70 Q122 90 112 102 Q128 125 115 140 Q135 165 122 175 L22 175 Q9 165 28 140 Q16 125 32 102 Q22 90 39 70 Q29 60 41 52 Q56 38 72 8 Z" fill="url(#treeGradBig)" stroke="#064e21" stroke-width="1.6"/>' +
        '<rect x="61" y="175" width="22" height="15" rx="3" fill="#451a03"/>' +
        '<ellipse cx="72" cy="190" rx="40" ry="2.8" fill="rgba(0,0,0,0.5)"/>' +
        // regalos
        '<rect x="24" y="181" width="19" height="10" rx="2" fill="url(#giftPurple)"/><rect x="31" y="181" width="3.5" height="10" fill="#f8fafc"/>' +
        '<rect x="54" y="173" width="28" height="18" rx="2.5" fill="url(#giftBlue)"/><rect x="66" y="173" width="4.5" height="18" fill="#e2e8f0"/><rect x="54" y="182" width="28" height="3.5" fill="#e2e8f0"/>' +
        '<path d="M62 173 C58 167 66 167 68 173 Z" fill="#cbd5e1"/><path d="M71 173 C75 167 69 167 68 173 Z" fill="#cbd5e1"/><circle cx="68" cy="173" r="1.8" fill="#fff"/>' +
        '<rect x="85" y="176" width="24" height="15" rx="2" fill="url(#giftGold)"/><rect x="95" y="176" width="4" height="15" fill="#ef4444"/><rect x="85" y="183" width="24" height="3" fill="#ef4444"/>' +
        '<rect x="42" y="178" width="22" height="13" rx="2" fill="url(#giftRed)"/><rect x="51" y="178" width="3.5" height="13" fill="#fde047"/><rect x="42" y="184" width="22" height="2.8" fill="#fde047"/>' +
        '<rect x="45" y="169" width="15" height="9" rx="1.5" fill="url(#giftGold)"/><rect x="50" y="169" width="3" height="9" fill="#dc2626"/>' +
        // estrella
        '<polygon class="star-glow" points="72,0 74,5 80,6 75,11 77,17 72,13 67,17 69,11 64,6 70,5" fill="#f5c542"/>' +
        // bombillas (cada una con clase bulb-dynamic)
        '<circle class="bulb-dynamic" cx="72" cy="32"  r="4.6" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="56" cy="58"  r="4.6" fill="#f5c542"/>' +
        '<circle class="bulb-dynamic" cx="88" cy="65"  r="4.6" fill="#38bdf8"/>' +
        '<circle class="bulb-dynamic" cx="42" cy="92"  r="4.6" fill="#22c55e"/>' +
        '<circle class="bulb-dynamic" cx="72" cy="98"  r="4.6" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="100" cy="90" r="4.6" fill="#f5c542"/>' +
        '<circle class="bulb-dynamic" cx="32" cy="130" r="4.6" fill="#38bdf8"/>' +
        '<circle class="bulb-dynamic" cx="58" cy="138" r="4.6" fill="#22c55e"/>' +
        '<circle class="bulb-dynamic" cx="84" cy="132" r="4.6" fill="#d4243b"/>' +
        '<circle class="bulb-dynamic" cx="110" cy="142" r="4.6" fill="#ec4899"/>' +
        '</svg>';

      var modoActual = 1;
      el.addEventListener("click", function () {
        el.classList.remove("modo-" + modoActual);
        modoActual = modoActual >= 5 ? 1 : modoActual + 1;
        el.classList.add("modo-" + modoActual);
      });

      document.body.appendChild(el);
    }

    function iniciarContadoresNavidad() {
      function actualizar() {
        var ahora = new Date();
        var anioActual = ahora.getFullYear();
        var navidad = new Date(anioActual, 11, 25, 0, 0, 0);
        if (ahora > navidad) navidad = new Date(anioActual + 1, 11, 25, 0, 0, 0);
        var anoNuevo = new Date(anioActual + 1, 0, 1, 0, 0, 0);

        function formatear(ms) {
          if (ms <= 0) return "¡Llegó!";
          var d = Math.floor(ms / 86400000);
          var h = Math.floor((ms % 86400000) / 3600000);
          var m = Math.floor((ms % 3600000) / 60000);
          var s = Math.floor((ms % 60000) / 1000);
          return d + "d " + h + "h " + m + "m " + s + "s";
        }

        var elX = document.getElementById("pp-timer-xmas");
        var elN = document.getElementById("pp-timer-newyear");
        if (elX) elX.textContent = formatear(navidad - ahora);
        if (elN) elN.textContent = formatear(anoNuevo - ahora);
      }
      actualizar();
      if (window.__ppTimerInterval) clearInterval(window.__ppTimerInterval);
      window.__ppTimerInterval = setInterval(actualizar, 1000);
    }

    // ========== NIEVE CON CANVAS (un solo elemento) ==========
    function initSnow() {
      if (reducedMotion) return;
      if (document.querySelector(".pp-snow-canvas")) return;

      var canvas = document.createElement("canvas");
      canvas.className = "pp-snow-canvas";
      document.body.appendChild(canvas);

      var ctx = canvas.getContext("2d");
      var flakes = [];
      var W, H;
      var running = true;
      var lastTime = 0;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      // Crear partículas (pool fijo)
      var COUNT = Math.min(55, Math.floor(W / 25)); // se adapta a la pantalla
      for (var i = 0; i < COUNT; i++) {
        flakes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 1.2 + Math.random() * 2.8,
          d: Math.random() * COUNT,          // densidad / velocidad base
          drift: Math.random() * 1.5 - 0.75,
          opacity: 0.4 + Math.random() * 0.5
        });
      }

      function draw(time) {
        if (!running || document.hidden) {
          requestAnimationFrame(draw);
          return;
        }

        var delta = Math.min((time - lastTime) / 16.67, 3); // normalizado a ~60fps
        lastTime = time;

        ctx.clearRect(0, 0, W, H);

        for (var i = 0; i < flakes.length; i++) {
          var f = flakes[i];
          
          // movimiento
          f.y += (Math.cos(f.d) + 1 + f.r / 2) * 0.55 * delta;
          f.x += Math.sin(f.d) * 0.6 * delta + f.drift * 0.3;

          // reiniciar cuando sale de pantalla
          if (f.y > H + 8) {
            f.y = -8;
            f.x = Math.random() * W;
          }
          if (f.x > W + 10) f.x = -10;
          if (f.x < -10) f.x = W + 10;

          // dibujar
          ctx.beginPath();
          ctx.globalAlpha = f.opacity;
          ctx.fillStyle = "#ffffff";
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);

      // Guardar para cleanup
      window.__ppSnowCleanup = function () {
        running = false;
        canvas.remove();
        window.removeEventListener("resize", resize);
      };
    }

    // Ejecución
    markLogos();
    putHats();
    placeLights();
    placeTopCounters();
    placeTree();
    initSnow();

    // Observer throttled
    if (!window.__ppNavidadObserver) {
      var scheduled = false;
      window.__ppNavidadObserver = new MutationObserver(function () {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(function () {
          markLogos();
          putHats();
          scheduled = false;
        });
      });
      window.__ppNavidadObserver.observe(document.body, { childList: true, subtree: true });
    }
  }

  runNavidadTheme();
  setTimeout(runNavidadTheme, 500);

  // Cleanup
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppTimerInterval) clearInterval(window.__ppTimerInterval);
    if (window.__ppSnowCleanup) window.__ppSnowCleanup();
    if (window.__ppNavidadObserver) {
      try { window.__ppNavidadObserver.disconnect(); } catch(e){}
      window.__ppNavidadObserver = null;
    }
    document.querySelectorAll(".pp-seasonal-hat, .pp-lights-overlay, .pp-xmas-tree, .pp-top-counters-bar, .pp-snow-canvas").forEach(function(e){ e.remove(); });
  };
})();
</script>
