<!-- Navidad: luces bien hechas (no sidebar) + nieve + fuegos canvas solo el 25 -->
<style id="pp-tema-style-navidad">
html.tema-navidad {
  --accent: #d4243b;
  --accent-glow: rgba(212, 36, 59, 0.45);
  --bg-main: #050a07;
  --bg-side: #0a130e;
  --bg-card: rgba(18, 36, 24, 0.72);
  --bg-secondary: #163022;
  --glass-border: rgba(13, 138, 69, 0.22);
  --text-main: #f4f7f5;
  --text-dim: #8aa396;
}
html.tema-navidad body {
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, rgba(13,138,69,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212,36,59,0.1) 0%, transparent 50%),
    var(--bg-main) !important;
}
html.tema-navidad aside.sidebar {
  background: linear-gradient(180deg, rgba(13,138,69,0.12) 0%, transparent 120px), var(--bg-side) !important;
  border-right: 1px solid rgba(13, 138, 69, 0.28) !important;
}
html.tema-navidad .nav-link:hover { background: rgba(13, 138, 69, 0.12) !important; }
html.tema-navidad .nav-link.active {
  background: linear-gradient(90deg, rgba(212,36,59,0.22), rgba(13,138,69,0.14)) !important;
  box-shadow: inset 3px 0 0 #d4243b;
}
html.tema-navidad .nav-link.active .nav-icon { color: #d4243b !important; }
html.tema-navidad .pl-thumb {
  background: linear-gradient(135deg, #163022, #0d8a45) !important;
  color: #fff !important;
}
html.tema-navidad .main-content {
  background: linear-gradient(180deg, rgba(18,40,28,0.92) 0%, var(--bg-main) 420px) !important;
}
html.tema-navidad .section-title {
  background: linear-gradient(90deg, #fff, #b8e6c8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
html.tema-navidad .search-wrap input {
  border-color: rgba(13,138,69,0.25) !important;
  background: rgba(13,138,69,0.08) !important;
}
html.tema-navidad .search-wrap input:focus {
  border-color: #d4243b !important;
  box-shadow: 0 0 0 3px rgba(212,36,59,0.15);
}
html.tema-navidad .album-card {
  background: rgba(18, 40, 28, 0.55) !important;
  border: 1px solid rgba(13,138,69,0.15);
}
html.tema-navidad .album-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: rgba(212,36,59,0.35);
  box-shadow: 0 12px 36px rgba(13,138,69,0.25);
}
html.tema-navidad .card-play-btn,
html.tema-navidad .btn-play-big {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
  box-shadow: 0 6px 28px rgba(212,36,59,0.5) !important;
}
html.tema-navidad .song-row-pl:hover {
  background: linear-gradient(90deg, rgba(212,36,59,0.1), rgba(13,138,69,0.08)) !important;
}
html.tema-navidad .player-bar {
  background: rgba(6, 12, 9, 0.92) !important;
  border-top: 1px solid rgba(13,138,69,0.25) !important;
}
html.tema-navidad .btn-play-bar {
  background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
  color: #14532d !important;
}
html.tema-navidad #seek-slider {
  background: linear-gradient(to right, #d4243b var(--seek-progress), #1a3024 var(--seek-progress)) !important;
}
html.tema-navidad #volume-slider {
  background: linear-gradient(to right, #0d8a45 var(--volume-progress), #1a3024 var(--volume-progress)) !important;
}
html.tema-navidad #auth-screen {
  background: radial-gradient(ellipse at 50% 20%, rgba(13,138,69,0.2), transparent 50%), #050a07 !important;
}
html.tema-navidad .auth-card {
  border: 1px solid rgba(13,138,69,0.3) !important;
  background: rgba(10, 18, 14, 0.92) !important;
}
html.tema-navidad .auth-btn {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
}
html.tema-navidad #loading-screen {
  background: radial-gradient(circle at 50% 35%, #153528 0%, #050a07 65%) !important;
}
html.tema-navidad .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #0d8a45, #d4243b) !important;
}
html.tema-navidad .pp-logo-icon,
html.tema-navidad aside.sidebar .w-8,
html.tema-navidad #auth-screen .w-10,
html.tema-navidad #loading-screen .w-10 {
  background: linear-gradient(135deg, #d4243b, #0d8a45) !important;
  box-shadow: 0 0 14px rgba(212,36,59,0.4);
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-seasonal-hat {
  position: absolute; top: -16px; left: 50%;
  transform: translateX(-40%) rotate(-14deg);
  pointer-events: none; z-index: 6;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.5));
  animation: pp-hat-pop .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .85s; width: 34px; height: 26px;
}
@keyframes pp-hat-pop {
  from { opacity: 0; transform: translateX(-40%) translateY(-18px) rotate(-30deg) scale(.4); }
  to   { opacity: 1; transform: translateX(-40%) rotate(-14deg) scale(1); }
}
.pp-logo-spin-hat .pp-logo-icon,
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-logo-flip 1.2s cubic-bezier(.45,.05,.55,.95) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-flip {
  0% { transform: rotateY(0) scale(1); }
  40% { transform: rotateY(180deg) scale(1.12); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-particle-nieve {
  position: absolute; top: -20px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.5));
  animation: pp-fall-snow linear forwards;
  will-change: transform, opacity;
}
@keyframes pp-fall-snow {
  0% { transform: translate3d(0,0,0); opacity: 0; }
  5% { opacity: 1; }
  100% { transform: translate3d(var(--drift,30px), 110vh, 0); opacity: .05; }
}
.pp-sparkle {
  position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
  box-shadow: 0 0 8px 2px rgba(255,220,150,.8);
  animation: pp-spark 1.4s ease-out forwards; pointer-events: none;
}
@keyframes pp-spark {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(2.5) translateY(-20px); opacity: 0; }
}
.pp-fx-screen {
  position: fixed; inset: 0; pointer-events: none; z-index: 41; overflow: hidden;
}
.pp-fw-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 42;
}
.pp-light-strip {
  position: absolute; left: 0; right: 0; height: 14px; pointer-events: none; z-index: 8;
  overflow: visible;
}
.pp-light-strip.top { top: 0; }
.pp-light-strip.bottom { bottom: 0; }
.pp-light-strip svg { width: 100%; height: 14px; display: block; }
.pp-lights-overlay {
  position: fixed; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 43;
  left: var(--pp-sidebar-w, 240px);
}
.pp-lights-overlay .pp-light-strip { position: absolute; left: 0; right: 0; }
.pp-lights-overlay .pp-light-strip.top { top: 0; }
.pp-lights-overlay .pp-light-strip.bottom { bottom: 0; }
@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-hat .pp-logo-icon, .pp-logo-spin-once .pp-logo-icon,
  .pp-seasonal-hat, .pp-particle-nieve, .pp-sparkle { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "navidad";
  var COLORS = ["#d4243b", "#0d8a45", "#f5c542", "#e8e8e8"];
  var HAT =
    '<svg viewBox="0 0 72 52" width="34" height="26" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M10 38 C10 18 28 4 42 4 C58 4 66 20 66 34" fill="#b91c1c"/>' +
    '<path d="M8 36 C14 22 30 10 44 10 C56 10 64 22 66 34" fill="#d4243b"/>' +
    '<ellipse cx="38" cy="38" rx="30" ry="7" fill="#f8fafc"/>' +
    '<circle cx="62" cy="12" r="7" fill="#f8fafc"/>' +
    '</svg>';
  var esDiaNavidad = (function () {
    var d = new Date();
    return d.getMonth() === 11 && d.getDate() === 25;
  })();

  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function markLogos() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar el logo");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function putHats() {
    $(".pp-logo-wrap").forEach(function (w) {
      var icon = w.querySelector(".pp-logo-icon") || w.querySelector("div");
      if (!icon || icon.querySelector(".pp-seasonal-hat")) return;
      icon.style.position = icon.style.position || "relative";
      var h = document.createElement("span");
      h.className = "pp-seasonal-hat";
      h.innerHTML = HAT;
      icon.appendChild(h);
    });
  }
  function spark(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    var layer = document.querySelector(".pp-fx-screen") || document.body;
    for (var i = 0; i < 6; i++) {
      var s = document.createElement("span");
      s.className = "pp-sparkle";
      s.style.left = r.left + r.width / 2 + (Math.random() - 0.5) * 48 + "px";
      s.style.top = r.top + r.height / 2 + (Math.random() - 0.5) * 32 + "px";
      layer.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 1500); })(s);
    }
  }
  function spin(wrap) {
    var list = wrap ? [wrap] : $(".pp-logo-wrap");
    list.forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      spark(w.querySelector(".pp-logo-icon") || w);
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1300);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bindClicks() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation(); spin(w);
      });
    });
  }
  function snow() {
    var layer = document.querySelector(".pp-fx-screen");
    if (!layer) {
      layer = document.createElement("div");
      layer.className = "pp-fx-screen";
      document.body.appendChild(layer);
    }
    function flake() {
      if (document.hidden) return;
      if (layer.querySelectorAll(".pp-particle-nieve").length > 40) return;
      var p = document.createElement("span");
      p.className = "pp-particle-nieve";
      var size = 2 + Math.random() * 6;
      p.style.left = Math.random() * 100 + "%";
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.setProperty("--drift", (Math.random() * 70 - 20) + "px");
      p.style.animationDuration = (8 + Math.random() * 10) + "s";
      layer.appendChild(p);
      setTimeout(function () { p.remove(); }, 19000);
    }
    for (var i = 0; i < 12; i++) flake();
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    window.__ppSnowTimer = setInterval(flake, 550);
  }

  function sidebarWidth() {
    var side = document.querySelector("aside.sidebar");
    if (!side || side.offsetParent === null) return 0;
    return side.getBoundingClientRect().width || 240;
  }
  function makeStripSVG(colors, count) {
    count = count || 18;
    var parts = [];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1000 14">');
    parts.push('<path d="M0 7 Q125 2 250 7 T500 7 T750 7 T1000 7" fill="none" stroke="rgba(180,180,180,0.35)" stroke-width="1.2"/>');
    for (var i = 0; i < count; i++) {
      var x = 20 + (i / (count - 1)) * 960;
      var y = 7 + Math.sin((i / (count - 1)) * Math.PI) * 2.5;
      var c = colors[i % colors.length];
      var delay = (i * 0.11).toFixed(2);
      parts.push('<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="'+c+'">');
      parts.push('<animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" begin="'+delay+'s" repeatCount="indefinite"/>');
      parts.push('<animate attributeName="r" values="2.6;3.8;2.6" dur="1.4s" begin="'+delay+'s" repeatCount="indefinite"/>');
      parts.push('</circle>');
      parts.push('<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+c+'" opacity="0.15">');
      parts.push('<animate attributeName="opacity" values="0.08;0.28;0.08" dur="1.4s" begin="'+delay+'s" repeatCount="indefinite"/>');
      parts.push('</circle>');
    }
    parts.push('</svg>');
    return parts.join('');
  }
  function placeLights() {
    document.documentElement.style.setProperty("--pp-sidebar-w", sidebarWidth() + "px");
    var ov = document.querySelector(".pp-lights-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.className = "pp-lights-overlay";
      ov.setAttribute("aria-hidden", "true");
      document.body.appendChild(ov);
    }
    ov.innerHTML = "";
    var top = document.createElement("div");
    top.className = "pp-light-strip top";
    top.innerHTML = makeStripSVG(COLORS, 22);
    ov.appendChild(top);
    var bot = document.createElement("div");
    bot.className = "pp-light-strip bottom";
    bot.innerHTML = makeStripSVG(COLORS.slice().reverse(), 20);
    ov.appendChild(bot);
    function localStrip(host) {
      if (!host || host.querySelector(".pp-light-strip-local")) return;
      if (host.closest && host.closest("aside.sidebar")) return;
      if (window.getComputedStyle(host).position === "static") host.style.position = "relative";
      var row = document.createElement("div");
      row.className = "pp-light-strip top pp-light-strip-local";
      row.innerHTML = makeStripSVG(COLORS, 14);
      host.insertBefore(row, host.firstChild);
    }
    localStrip(document.querySelector(".player-bar"));
    localStrip(document.getElementById("loading-screen"));
    var auth = document.querySelector("#auth-screen .auth-card");
    if (auth) localStrip(auth);
    if (!window.__ppLightsResize) {
      window.__ppLightsResize = function () {
        document.documentElement.style.setProperty("--pp-sidebar-w", sidebarWidth() + "px");
      };
      window.addEventListener("resize", window.__ppLightsResize);
    }
  }

  /* Fuegos canvas solo el 25 — optimizados */
  var fwCanvas = null, fwCtx = null, fwParticles = [], fwRaf = null, fwLastBurst = 0;
  var FW_MAX = 80;
  function ensureFWCanvas() {
    if (fwCanvas && fwCanvas.parentNode) return;
    fwCanvas = document.createElement("canvas");
    fwCanvas.className = "pp-fw-canvas";
    document.body.appendChild(fwCanvas);
    fwCtx = fwCanvas.getContext("2d", { alpha: true });
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      fwCanvas.width = Math.floor(window.innerWidth * dpr);
      fwCanvas.height = Math.floor(window.innerHeight * dpr);
      fwCanvas.style.width = window.innerWidth + "px";
      fwCanvas.style.height = window.innerHeight + "px";
      fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);
  }
  function explode(x, y) {
    if (!esDiaNavidad || fwParticles.length > FW_MAX) return;
    ensureFWCanvas();
    var col = COLORS[Math.floor(Math.random() * COLORS.length)];
    var n = 12 + Math.floor(Math.random() * 8);
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.15;
      var spd = 1.8 + Math.random() * 3.2;
      fwParticles.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 1, decay: 0.016 + Math.random() * 0.012, color: col, size: 1.8 + Math.random() * 1.6
      });
    }
  }
  function randomBurst() {
    if (!esDiaNavidad || document.hidden) return;
    var now = Date.now();
    if (now - fwLastBurst < 1000) return;
    fwLastBurst = now;
    explode(window.innerWidth * (0.12 + Math.random() * 0.76), window.innerHeight * (0.08 + Math.random() * 0.42));
  }
  function loopFW() {
    fwRaf = requestAnimationFrame(loopFW);
    if (!fwCtx || !fwCanvas) return;
    var w = window.innerWidth, h = window.innerHeight;
    fwCtx.clearRect(0, 0, w, h);
    for (var i = fwParticles.length - 1; i >= 0; i--) {
      var p = fwParticles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
      if (p.life <= 0) { fwParticles.splice(i, 1); continue; }
      fwCtx.globalAlpha = Math.max(0, p.life * 0.9);
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fwCtx.fill();
    }
    fwCtx.globalAlpha = 1;
  }
  function startFW() {
    if (!esDiaNavidad) return;
    ensureFWCanvas();
    if (fwRaf) cancelAnimationFrame(fwRaf);
    loopFW();
    setTimeout(randomBurst, 500);
    setTimeout(randomBurst, 1200);
    if (window.__ppXmasFWTimer) clearInterval(window.__ppXmasFWTimer);
    window.__ppXmasFWTimer = setInterval(randomBurst, 2000);
  }
  function stopFW() {
    if (window.__ppXmasFWTimer) clearInterval(window.__ppXmasFWTimer);
    if (fwRaf) cancelAnimationFrame(fwRaf);
    fwRaf = null; fwParticles = [];
    if (fwCanvas && fwCanvas.parentNode) fwCanvas.parentNode.removeChild(fwCanvas);
    fwCanvas = null; fwCtx = null;
  }

  /* Visualizador: bombillas en la barra */
  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
    var w = canvas.width, h = canvas.height, n = Math.max(16, Math.floor(w / 30));
    var muestra = api.muestra, sens = api.sensitivity || 1.6;
    var t = (api.colorOffset || 0) * 0.04;
    ctx.beginPath();
    ctx.strokeStyle = "rgba(180,180,180,0.35)";
    ctx.lineWidth = 1.5;
    for (var i = 0; i <= n; i++) {
      var x = (i / n) * w;
      var sag = Math.sin((i / n) * Math.PI) * (h * 0.12) + Math.sin(t + i * 0.35) * 2;
      var y = h * 0.28 + sag;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (var j = 0; j < n; j++) {
      var prom = muestra(data, j, n);
      var level = Math.min(1, (prom / 255) * sens);
      var x2 = ((j + 0.5) / n) * w;
      var sag2 = Math.sin(((j + 0.5) / n) * Math.PI) * (h * 0.12) + Math.sin(t + j * 0.35) * 2;
      var y2 = h * 0.28 + sag2;
      var col = COLORS[j % COLORS.length];
      var r = 3 + level * Math.min(9, h * 0.2);
      var g = ctx.createRadialGradient(x2, y2, 0, x2, y2, r * 2.8);
      g.addColorStop(0, col);
      g.addColorStop(0.4, col + "66");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x2, y2, r * 2.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5 + level * 0.5;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x2, y2, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (esDiaNavidad) {
      var bass = muestra(data, 0, 6) / 255;
      if (bass > 0.55 && Math.random() < 0.08) randomBurst();
    }
    return true;
  };

  function enableVisLights() {
    function tryOn() {
      if (window.ProPlayerVis && window.ProPlayerVis.forceMount) { window.ProPlayerVis.forceMount(); return true; }
      return false;
    }
    if (!tryOn()) {
      var n = 0;
      var iv = setInterval(function () { if (tryOn() || ++n > 40) clearInterval(iv); }, 250);
    }
  }

  markLogos(); putHats(); bindClicks();
  snow(); placeLights(); enableVisLights(); startFW();

  setTimeout(function () {
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.add("pp-logo-spin-hat");
      setTimeout(function () { w.classList.remove("pp-logo-spin-hat"); }, 1400);
    });
  }, 400);

  if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
  window.__ppLogoRepeat = setInterval(function () {
    if (window.__ppTriggerLogoAnim) window.__ppTriggerLogoAnim();
  }, 8 * 60 * 1000);

  if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e) {}
  window.__ppLogoObserver = new MutationObserver(function () {
    markLogos(); putHats(); bindClicks();
  });
  window.__ppLogoObserver.observe(document.body, { childList: true, subtree: true });

  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    window.__ppSeasonalVisDraw = null;
    stopFW();
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
    if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e2) {}
    document.querySelectorAll(".pp-seasonal-hat, .pp-fx-screen, .pp-sparkle, .pp-lights-overlay, .pp-light-strip, .pp-fw-canvas").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
