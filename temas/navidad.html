<!-- ProPlayer tema NAVIDAD — luces = visualizador de audio -->
<style id="pp-tema-style-navidad">
html.tema-navidad {
  --accent: #d4243b;
  --accent-glow: rgba(212, 36, 59, 0.45);
  --accent-seasonal: #0d8a45;
  --bg-main: #050a07;
  --bg-side: #0a130e;
  --bg-card: rgba(18, 36, 24, 0.72);
  --bg-secondary: #163022;
  --glass-border: rgba(13, 138, 69, 0.22);
  --text-main: #f4f7f5;
  --text-dim: #8aa396;
}
html.tema-navidad body {
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%, rgba(13,138,69,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212,36,59,0.1) 0%, transparent 50%),
    var(--bg-main) !important;
}
html.tema-navidad aside.sidebar {
  background:
    linear-gradient(180deg, rgba(13,138,69,0.12) 0%, transparent 120px),
    var(--bg-side) !important;
  border-right: 1px solid rgba(13, 138, 69, 0.28) !important;
  /* sin franja de luces en el sidebar */
}
html.tema-navidad .nav-link:hover { background: rgba(13, 138, 69, 0.12) !important; }
html.tema-navidad .nav-link.active {
  background: linear-gradient(90deg, rgba(212,36,59,0.22), rgba(13,138,69,0.14)) !important;
  box-shadow: inset 3px 0 0 #d4243b;
}
html.tema-navidad .nav-link.active .nav-icon { color: #d4243b !important; }
html.tema-navidad .playlist-nav-item:hover { background: rgba(212, 36, 59, 0.1) !important; }
html.tema-navidad .pl-thumb {
  background: linear-gradient(135deg, #163022, #0d8a45) !important;
  color: #fff !important;
}
html.tema-navidad .main-content {
  background: linear-gradient(180deg, rgba(18,40,28,0.92) 0%, var(--bg-main) 420px) !important;
}
html.tema-navidad .section-title {
  background: linear-gradient(90deg, #fff, #b8e6c8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
html.tema-navidad #home-version-watermark {
  background: linear-gradient(90deg, #d4243b, #0d8a45, #d4243b) !important;
  -webkit-background-clip: text !important; background-clip: text !important;
  color: transparent !important; opacity: 0.12 !important;
}
html.tema-navidad .search-wrap input {
  border-color: rgba(13,138,69,0.25) !important;
  background: rgba(13,138,69,0.08) !important;
}
html.tema-navidad .search-wrap input:focus {
  border-color: #d4243b !important;
  box-shadow: 0 0 0 3px rgba(212,36,59,0.15);
}
html.tema-navidad .album-card {
  background: rgba(18, 40, 28, 0.55) !important;
  border: 1px solid rgba(13,138,69,0.15);
}
html.tema-navidad .album-card:hover {
  transform: translateY(-5px) scale(1.025);
  border-color: rgba(212,36,59,0.35);
  box-shadow: 0 12px 36px rgba(13,138,69,0.25);
}
html.tema-navidad .card-play-btn,
html.tema-navidad .btn-play-big {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
  box-shadow: 0 6px 28px rgba(212,36,59,0.5) !important;
}
html.tema-navidad .song-row-pl:hover {
  background: linear-gradient(90deg, rgba(212,36,59,0.1), rgba(13,138,69,0.08)) !important;
}
/* Barra del player: el visualizador lleva las luces */
html.tema-navidad .player-bar {
  background: rgba(6, 12, 9, 0.92) !important;
  border-top: 1px solid rgba(13,138,69,0.25) !important;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.45);
}
html.tema-navidad .btn-play-bar {
  background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
  color: #14532d !important;
  box-shadow: 0 0 16px rgba(13,138,69,0.4);
}
html.tema-navidad #seek-slider {
  background: linear-gradient(to right, #d4243b var(--seek-progress), #1a3024 var(--seek-progress)) !important;
}
html.tema-navidad #volume-slider {
  background: linear-gradient(to right, #0d8a45 var(--volume-progress), #1a3024 var(--volume-progress)) !important;
}
html.tema-navidad #footer-art {
  box-shadow: 0 0 0 2px rgba(212,36,59,0.35);
}
html.tema-navidad #auth-screen {
  background: radial-gradient(ellipse at 50% 20%, rgba(13,138,69,0.2), transparent 50%), #050a07 !important;
}
html.tema-navidad .auth-card {
  border: 1px solid rgba(13,138,69,0.3) !important;
  background: rgba(10, 18, 14, 0.92) !important;
}
html.tema-navidad .auth-btn {
  background: linear-gradient(135deg, #d4243b, #a01a2e) !important;
}
html.tema-navidad #loading-screen {
  background: radial-gradient(circle at 50% 35%, #153528 0%, #050a07 65%) !important;
}
html.tema-navidad .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #0d8a45, #d4243b) !important;
}
html.tema-navidad .pp-logo-icon,
html.tema-navidad aside.sidebar .w-8,
html.tema-navidad #auth-screen .w-10,
html.tema-navidad #loading-screen .w-10 {
  background: linear-gradient(135deg, #d4243b, #0d8a45) !important;
  box-shadow: 0 0 14px rgba(212,36,59,0.4);
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-seasonal-hat {
  position: absolute; top: -16px; left: 50%;
  transform: translateX(-40%) rotate(-14deg);
  pointer-events: none; z-index: 6;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.5));
  animation: pp-hat-pop .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .85s; width: 34px; height: 26px;
}
@keyframes pp-hat-pop {
  from { opacity: 0; transform: translateX(-40%) translateY(-18px) rotate(-30deg) scale(.4); }
  to   { opacity: 1; transform: translateX(-40%) rotate(-14deg) scale(1); }
}
.pp-logo-spin-hat .pp-logo-icon,
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-logo-flip 1.2s cubic-bezier(.45,.05,.55,.95) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-flip {
  0% { transform: rotateY(0) scale(1); }
  40% { transform: rotateY(180deg) scale(1.12); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-particle-nieve {
  position: absolute; top: -24px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.5));
  box-shadow: 0 0 6px rgba(255,255,255,.4);
  animation: pp-fall-snow linear forwards;
}
@keyframes pp-fall-snow {
  0% { transform: translateY(0); opacity: 0; }
  5% { opacity: 1; }
  100% { transform: translateY(110vh) translateX(var(--drift,40px)); opacity: .05; }
}
.pp-sparkle {
  position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%;
  box-shadow: 0 0 10px 2px rgba(255,220,150,.85);
  animation: pp-spark 1.6s ease-out forwards; pointer-events: none;
}
@keyframes pp-spark {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(2.8) translateY(-24px); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-hat .pp-logo-icon, .pp-logo-spin-once .pp-logo-icon,
  .pp-seasonal-hat, .pp-particle-nieve, .pp-sparkle { animation: none !important; }
}

.pp-fx-screen {
  position: fixed; inset: 0; pointer-events: none; z-index: 42; overflow: hidden;
}
.pp-fw-dot {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  pointer-events: none; box-shadow: 0 0 8px currentColor;
}
.pp-light-strip {
  position: absolute; left: 0; right: 0; height: 6px; pointer-events: none; z-index: 5;
  display: flex; justify-content: space-around; align-items: center; overflow: hidden;
}
.pp-light-strip.top { top: 0; }
.pp-light-strip span {
  width: 7px; height: 7px; border-radius: 50%;
  box-shadow: 0 0 8px currentColor;
  animation: pp-bulb 1.35s ease-in-out infinite;
}
@keyframes pp-bulb {
  0%,100% { opacity: .35; transform: scale(.85); }
  50% { opacity: 1; transform: scale(1.2); }
}
</style>
<script>
(function () {
  var ID = "navidad";
  var HAT =
    '<svg viewBox="0 0 72 52" width="34" height="26" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M10 38 C10 18 28 4 42 4 C58 4 66 20 66 34" fill="#b91c1c"/>' +
    '<path d="M8 36 C14 22 30 10 44 10 C56 10 64 22 66 34" fill="#d4243b"/>' +
    '<ellipse cx="38" cy="38" rx="30" ry="7" fill="#f8fafc"/>' +
    '<circle cx="62" cy="12" r="7" fill="#f8fafc"/>' +
    '</svg>';
  var COLORS = ["#d4243b", "#0d8a45", "#f5c542", "#e8e8e8", "#d4243b", "#0d8a45"];

  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

  function markLogos() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar el logo");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function putHats() {
    $(".pp-logo-wrap").forEach(function (w) {
      var icon = w.querySelector(".pp-logo-icon") || w.querySelector("div");
      if (!icon || icon.querySelector(".pp-seasonal-hat")) return;
      icon.style.position = icon.style.position || "relative";
      var h = document.createElement("span");
      h.className = "pp-seasonal-hat";
      h.innerHTML = HAT;
      icon.appendChild(h);
    });
  }
  function spark(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    var layer = document.querySelector(".pp-seasonal-fx-layer") || document.body;
    for (var i = 0; i < 8; i++) {
      var s = document.createElement("span");
      s.className = "pp-sparkle";
      s.style.left = r.left + r.width / 2 + (Math.random() - 0.5) * 50 + "px";
      s.style.top = r.top + r.height / 2 + (Math.random() - 0.5) * 36 + "px";
      layer.appendChild(s);
      (function (n) { setTimeout(function () { n.remove(); }, 1700); })(s);
    }
  }
  function spin(wrap) {
    var list = wrap ? [wrap] : $(".pp-logo-wrap");
    list.forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      spark(w.querySelector(".pp-logo-icon") || w);
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1300);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bindClicks() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation(); spin(w);
      });
    });
  }
  function snow() {
    var layer = document.querySelector(".pp-fx-screen") || document.querySelector(".pp-seasonal-fx-layer");
    if (!layer) {
      layer = document.createElement("div");
      layer.className = "pp-fx-screen";
      document.body.appendChild(layer);
    }
    function flake() {
      if (document.hidden) return;
      if (layer.querySelectorAll(".pp-particle-nieve").length > 55) return;
      var p = document.createElement("span");
      p.className = "pp-particle-nieve";
      var size = 2 + Math.random() * 7;
      p.style.left = Math.random() * 100 + "%";
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.setProperty("--drift", (Math.random() * 80 - 20) + "px");
      p.style.animationDuration = (7 + Math.random() * 10) + "s";
      layer.appendChild(p);
      setTimeout(function () { p.remove(); }, 18000);
    }
    for (var i = 0; i < 16; i++) flake();
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    window.__ppSnowTimer = setInterval(flake, 450);
  }

/* Fuegos artificiales SOLO el 25 de diciembre */
  var esDiaNavidad = (function () {
    var d = new Date();
    return d.getMonth() === 11 && d.getDate() === 25; // mes 0-index: 11 = diciembre
  })();
  var fwParticles = [];
  var FW_COLORS = ["#d4243b", "#0d8a45", "#f5c542", "#ffffff", "#ff6b6b", "#7dd3a0"];
  function spawnXmasFirework(w, h) {
    if (!esDiaNavidad) return;
    var x = (0.12 + Math.random() * 0.76) * w;
    var y = (0.12 + Math.random() * 0.4) * h;
    var col = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    var count = 16 + Math.floor(Math.random() * 12);
    for (var i = 0; i < count; i++) {
      var ang = (Math.PI * 2 * i) / count + Math.random() * 0.15;
      var spd = 1.1 + Math.random() * 3;
      fwParticles.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 1, decay: 0.014 + Math.random() * 0.018, color: col, size: 1.4 + Math.random() * 2
      });
    }
  }

  /* ===== Luces navideñas = visualizador de audio (barra inferior) ===== */
  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
    var w = canvas.width;
    var h = canvas.height;
    var n = Math.max(18, Math.floor(w / 28));
    var muestra = api.muestra;
    var sens = api.sensitivity || 1.6;
    var t = (api.colorOffset || 0) * 0.04;

    // cable
    ctx.beginPath();
    ctx.strokeStyle = "rgba(180,180,180,0.35)";
    ctx.lineWidth = 1.5;
    for (var i = 0; i <= n; i++) {
      var x = (i / n) * w;
      var sag = Math.sin((i / n) * Math.PI) * (h * 0.12) + Math.sin(t + i * 0.35) * 2;
      var y = h * 0.28 + sag;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // bombillas reaccionan al audio
    for (var j = 0; j < n; j++) {
      var prom = muestra(data, j, n);
      var level = Math.min(1, (prom / 255) * sens);
      var x2 = ((j + 0.5) / n) * w;
      var sag2 = Math.sin(((j + 0.5) / n) * Math.PI) * (h * 0.12) + Math.sin(t + j * 0.35) * 2;
      var y2 = h * 0.28 + sag2;
      var col = COLORS[j % COLORS.length];
      var r = 3 + level * Math.min(10, h * 0.22);

      // glow
      var g = ctx.createRadialGradient(x2, y2, 0, x2, y2, r * 3.2);
      g.addColorStop(0, col);
      g.addColorStop(0.35, col + "88");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x2, y2, r * 3.2, 0, Math.PI * 2);
      ctx.fill();

      // bulb body
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.45 + level * 0.55;
      ctx.beginPath();
      ctx.arc(x2, y2, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // highlight
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.arc(x2 - r * 0.25, y2 - r * 0.3, Math.max(1, r * 0.28), 0, Math.PI * 2);
      ctx.fill();

      // socket
      ctx.fillStyle = "rgba(200,200,200,0.5)";
      ctx.fillRect(x2 - 1.5, y2 - r - 3, 3, 3);
    }

    // barras suaves abajo reaccionando (refuerzo)
    var bars = Math.min(48, n * 2);
    for (var k = 0; k < bars; k++) {
      var p2 = muestra(data, k, bars);
      var bh = Math.max(1, (p2 / 255) * h * 0.35 * sens);
      var bw = w / bars;
      ctx.fillStyle = COLORS[k % COLORS.length] + "33";
      ctx.fillRect(k * bw + 1, h - bh, Math.max(1, bw - 2), bh);
    }

    // Fuegos artificiales solo el 25 de diciembre (barra + pantalla completa)
    if (esDiaNavidad) {
      var bass = muestra(data, 0, 6) / 255;
      if (bass > 0.52 && Math.random() < 0.15 + bass * 0.3) {
        spawnXmasFirework(w, h);
        if (typeof burstScreen === "function") burstScreen();
      }
      for (var fi = fwParticles.length - 1; fi >= 0; fi--) {
        var fp = fwParticles[fi];
        fp.x += fp.vx; fp.y += fp.vy; fp.vy += 0.045; fp.life -= fp.decay;
        if (fp.life <= 0) { fwParticles.splice(fi, 1); continue; }
        ctx.globalAlpha = Math.max(0, fp.life);
        ctx.fillStyle = fp.color;
        ctx.shadowColor = fp.color;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(fp.x, fp.y, fp.size * fp.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    return true; // sustituye el visualizador normal
  };


  function placeLights() {
    var colors = ["#d4243b", "#0d8a45", "#f5c542", "#e8e8e8"];
    function strip(host) {
      if (!host || host.querySelector(".pp-light-strip")) return;
      if (host.closest && host.closest("aside.sidebar")) return;
      if (window.getComputedStyle(host).position === "static") host.style.position = "relative";
      var row = document.createElement("div");
      row.className = "pp-light-strip top";
      for (var i = 0; i < 16; i++) {
        var s = document.createElement("span");
        s.style.color = colors[i % colors.length];
        s.style.background = colors[i % colors.length];
        s.style.animationDelay = (i * 0.1) + "s";
        row.appendChild(s);
      }
      host.appendChild(row);
    }
    strip(document.querySelector(".player-bar"));
    strip(document.querySelector(".main-content"));
    strip(document.getElementById("loading-screen"));
    var auth = document.querySelector("#auth-screen .auth-card");
    if (auth) strip(auth);
  }

  /* Fuegos a PANTALLA COMPLETA solo el 25 */
  var screenFW = [];
  var fwRaf = null;
  function explodeScreen(x, y) {
    if (!esDiaNavidad) return;
    var cols = ["#d4243b", "#0d8a45", "#f5c542", "#ffffff", "#ff6b6b"];
    var col = cols[Math.floor(Math.random() * cols.length)];
    var n = 26 + Math.floor(Math.random() * 16);
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.2;
      var spd = 2.2 + Math.random() * 5.5;
      screenFW.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 1, decay: 0.009 + Math.random() * 0.015, color: col, size: 2 + Math.random() * 2.5
      });
    }
  }
  function loopScreenFW() {
    fwRaf = requestAnimationFrame(loopScreenFW);
    if (!esDiaNavidad) return;
    var layer = document.querySelector(".pp-fx-screen");
    if (!layer) return;
    layer.querySelectorAll(".pp-fw-dot").forEach(function (e) { e.remove(); });
    for (var i = screenFW.length - 1; i >= 0; i--) {
      var p = screenFW[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.055; p.life -= p.decay;
      if (p.life <= 0) { screenFW.splice(i, 1); continue; }
      var d = document.createElement("span");
      d.className = "pp-fw-dot";
      d.style.left = p.x + "px";
      d.style.top = p.y + "px";
      d.style.width = (p.size * p.life) + "px";
      d.style.height = (p.size * p.life) + "px";
      d.style.background = p.color;
      d.style.color = p.color;
      d.style.opacity = String(Math.max(0, p.life));
      layer.appendChild(d);
    }
  }
  function burstScreen() {
    if (!esDiaNavidad || document.hidden) return;
    explodeScreen(window.innerWidth * (0.1 + Math.random() * 0.8), window.innerHeight * (0.08 + Math.random() * 0.45));
  }

  function enableVisLights() {

    function tryOn() {
      if (window.ProPlayerVis && typeof window.ProPlayerVis.forceMount === "function") {
        window.ProPlayerVis.forceMount();
        return true;
      }
      return false;
    }
    if (!tryOn()) {
      var n = 0;
      var iv = setInterval(function () {
        n++;
        if (tryOn() || n > 40) clearInterval(iv);
      }, 250);
    }
  }

  markLogos();
  putHats();
  bindClicks();
  snow();
  placeLights();
  enableVisLights();
  if (esDiaNavidad) {
    for (var bi = 0; bi < 3; bi++) setTimeout(burstScreen, 400 + bi * 500);
    if (window.__ppXmasFWTimer) clearInterval(window.__ppXmasFWTimer);
    window.__ppXmasFWTimer = setInterval(burstScreen, 1600);
    if (fwRaf) cancelAnimationFrame(fwRaf);
    loopScreenFW();
  }

  setTimeout(function () {
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.add("pp-logo-spin-hat");
      setTimeout(function () { w.classList.remove("pp-logo-spin-hat"); }, 1400);
    });
  }, 400);

  if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
  window.__ppLogoRepeat = setInterval(function () {
    if (window.__ppTriggerLogoAnim) window.__ppTriggerLogoAnim();
  }, 8 * 60 * 1000);

  if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e) {}
  window.__ppLogoObserver = new MutationObserver(function () {
    markLogos(); putHats(); bindClicks();
  });
  window.__ppLogoObserver.observe(document.body, { childList: true, subtree: true });

  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    window.__ppSeasonalVisDraw = null; fwParticles = []; screenFW = [];
    if (window.__ppXmasFWTimer) clearInterval(window.__ppXmasFWTimer);
    if (fwRaf) cancelAnimationFrame(fwRaf);
    document.querySelectorAll(".pp-light-strip, .pp-fx-screen, .pp-fw-dot").forEach(function (e) { e.remove(); });
    if (window.__ppSnowTimer) clearInterval(window.__ppSnowTimer);
    if (window.__ppLogoRepeat) clearInterval(window.__ppLogoRepeat);
    if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e2) {}
    $(".pp-seasonal-hat, .pp-seasonal-fx-layer, .pp-fx-screen, .pp-sparkle, .pp-light-strip").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-hat", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
