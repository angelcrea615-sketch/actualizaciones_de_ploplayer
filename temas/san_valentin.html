<!-- ProPlayer tema: san valentín (rico) -->
<style id="pp-tema-style-san_valentin">
html.tema-san_valentin {
  --accent: #e11d48;
  --bg-main: #0c080a;
  --bg-side: #160c12;
}
html.tema-san_valentin body {
  background: radial-gradient(ellipse at top, #2a1020 0%, #0c080a 55%) fixed;
}
html.tema-san_valentin .btn-play-big {
  box-shadow: 0 4px 28px rgba(225, 29, 72, 0.5) !important;
}
html.tema-san_valentin aside.sidebar {
  position: relative;
  background: linear-gradient(180deg, rgba(225,29,72,.1), transparent 110px), var(--bg-side) !important;
}
html.tema-san_valentin aside.sidebar::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #e11d48, #fb7185, #e11d48, transparent);
  pointer-events: none; z-index: 2;
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-heartbeat .pp-logo-icon { animation: pp-logo-heartbeat 1.35s ease-in-out infinite; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-sv-spin 1s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-heartbeat {
  0%,100% { transform: scale(1); }
  14% { transform: scale(1.14); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
  56% { transform: scale(1); }
}
@keyframes pp-sv-spin {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.18); filter: drop-shadow(0 0 12px rgba(225,29,72,.8)); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-particle-corazon {
  position: absolute; top: -24px; line-height: 1;
  text-shadow: 0 0 8px rgba(225, 29, 72, 0.55);
  animation: pp-fall-heart linear forwards;
  background: transparent !important;
}
@keyframes pp-fall-heart {
  0% { transform: translateY(0) scale(0.7) rotate(-10deg); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translateY(108vh) scale(1.2) rotate(15deg); opacity: 0; }
}
.pp-sv-label {
  font-size: 10px; letter-spacing: .12em; color: #fb7185; opacity: .7;
  text-align: center; margin-top: 4px;
}
@media (prefers-reduced-motion: reduce) {
  .pp-logo-heartbeat .pp-logo-icon, .pp-logo-spin-once .pp-logo-icon,
  .pp-particle-corazon { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "san_valentin";
  function qsAll(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function markLogos() {
    qsAll("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap", "pp-logo-heartbeat");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function burstHearts(el) {
    var layer = document.querySelector(".pp-seasonal-fx-layer") || document.body;
    var rect = el ? el.getBoundingClientRect() : { left: window.innerWidth / 2, top: 80, width: 0, height: 0 };
    for (var i = 0; i < 6; i++) {
      var h = document.createElement("span");
      h.className = "pp-particle-corazon";
      h.textContent = Math.random() > 0.5 ? "♥" : "💖";
      h.style.left = rect.left + rect.width / 2 + (Math.random() - 0.5) * 40 + "px";
      h.style.top = rect.top + "px";
      h.style.fontSize = 12 + Math.random() * 12 + "px";
      h.style.color = Math.random() > 0.4 ? "#e11d48" : "#fb7185";
      h.style.animationDuration = "2.5s";
      layer.appendChild(h);
      (function (n) { setTimeout(function () { n.remove(); }, 2800); })(h);
    }
  }
  function spinLogo(wrap) {
    var targets = wrap ? [wrap] : qsAll(".pp-logo-wrap");
    targets.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      burstHearts(w);
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1100);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spinLogo(w || null); };
  function bindClicks() {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        spinLogo(w);
      });
    });
  }
  var r = document.documentElement;
  r.style.setProperty("--accent", "#e11d48");
  r.style.setProperty("--bg-main", "#0c080a");
  r.style.setProperty("--bg-side", "#160c12");
  markLogos();
  bindClicks();
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-sv-label")) {
    var lab = document.createElement("div");
    lab.className = "pp-sv-label";
    lab.textContent = "Love is playing";
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(lab, ring.nextSibling);
  }
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function heart() {
    if (document.hidden || layer.querySelectorAll(".pp-particle-corazon").length > 28) return;
    var p = document.createElement("span");
    p.className = "pp-particle-corazon";
    p.textContent = Math.random() > 0.7 ? "💖" : "♥";
    p.style.left = Math.random() * 100 + "%";
    p.style.fontSize = 10 + Math.random() * 16 + "px";
    p.style.color = Math.random() > 0.4 ? "#e11d48" : "#fb7185";
    p.style.animationDuration = (7 + Math.random() * 7) + "s";
    layer.appendChild(p);
    setTimeout(function () { p.remove(); }, 15000);
  }
  for (var i = 0; i < 10; i++) heart();
  if (window.__ppHeartTimer) clearInterval(window.__ppHeartTimer);
  window.__ppHeartTimer = setInterval(heart, 750);
  setTimeout(function () { spinLogo(); }, 500);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppHeartTimer) clearInterval(window.__ppHeartTimer);
    qsAll(".pp-seasonal-fx-layer, .pp-sv-label").forEach(function (e) { e.remove(); });
    qsAll(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-heartbeat", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
