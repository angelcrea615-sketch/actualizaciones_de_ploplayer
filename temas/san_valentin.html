<!-- ProPlayer tema San Valentín: visualizador temático -->
<style id="pp-tema-style-san_valentin">
html.tema-san_valentin {
  --accent: #e11d48; --accent-glow: #e11d4866;
  --bg-main: #0c080a; --bg-side: #160c12;
  --bg-secondary: #e11d4822; --glass-border: #e11d4833;
}
html.tema-san_valentin body {
  background: radial-gradient(ellipse 80% 45% at 50% -5%, #e11d4822 0%, transparent 55%), #0c080a !important;
}
html.tema-san_valentin aside.sidebar {
  background: linear-gradient(180deg, #e11d4818 0%, transparent 120px), #160c12 !important;
  border-right: 1px solid #e11d4840 !important;
}
html.tema-san_valentin .nav-link.active {
  background: linear-gradient(90deg, #e11d4830, #fb718518) !important;
  box-shadow: inset 3px 0 0 #e11d48;
}
html.tema-san_valentin .nav-link.active .nav-icon { color: #e11d48 !important; }
html.tema-san_valentin .main-content {
  background: linear-gradient(180deg, #e11d4816 0%, #0c080a 400px) !important;
}
html.tema-san_valentin .album-card { background: #160c12aa !important; border: 1px solid #e11d4822; }
html.tema-san_valentin .album-card:hover {
  border-color: #e11d4855; box-shadow: 0 12px 32px #e11d4828; transform: translateY(-4px);
}
html.tema-san_valentin .card-play-btn, html.tema-san_valentin .btn-play-big {
  background: linear-gradient(135deg, #e11d48, #fb7185) !important;
  box-shadow: 0 6px 24px #e11d4850 !important;
}
html.tema-san_valentin .song-row-pl:hover { background: linear-gradient(90deg, #e11d4818, transparent) !important; }
html.tema-san_valentin .player-bar {
  background: #0c080aee !important; border-top: 1px solid #e11d4840 !important;
}
html.tema-san_valentin .btn-play-bar { background: #e11d48 !important; color: #111 !important; }
html.tema-san_valentin #seek-slider {
  background: linear-gradient(to right, #e11d48 var(--seek-progress), #160c12 var(--seek-progress)) !important;
}
html.tema-san_valentin #volume-slider {
  background: linear-gradient(to right, #fb7185 var(--volume-progress), #160c12 var(--volume-progress)) !important;
}
html.tema-san_valentin #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, #e11d4822, transparent 55%), #0c080a !important;
}
html.tema-san_valentin .auth-btn { background: linear-gradient(135deg, #e11d48, #fb7185) !important; }
html.tema-san_valentin #loading-screen {
  background: radial-gradient(circle at 50% 35%, #e11d4830, #0c080a 65%) !important;
}
html.tema-san_valentin .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #e11d48, #fb7185) !important;
}
html.tema-san_valentin .pp-logo-icon,
html.tema-san_valentin aside.sidebar .w-8,
html.tema-san_valentin #auth-screen .w-10,
html.tema-san_valentin #loading-screen .w-10 {
  background: linear-gradient(135deg, #e11d48, #fb7185) !important;
}
.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; }
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-spin-all 1.1s cubic-bezier(.4,.05,.5,1) both; transform-style: preserve-3d;
}
@keyframes pp-spin-all {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.15); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
@keyframes pp-hf{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:1}100%{transform:translateY(110vh);opacity:0}}
</style>
<script>
(function () {
  var ID = "san_valentin";
  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spin(wrap) {
    (wrap ? [wrap] : $(".pp-logo-wrap")).forEach(function (w) {
      w.classList.remove("pp-logo-spin-once"); void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); spin(w); });
    });
  }
  mark(); bind();
  
  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
    var w = canvas.width, h = canvas.height, n = 28, muestra = api.muestra, sens = api.sensitivity || 1.6;
    for (var i = 0; i < n; i++) {
      var prom = muestra(data, i, n);
      var level = Math.min(1, (prom/255)*sens);
      var x = ((i+0.5)/n)*w;
      var y = h * 0.55 - level * h * 0.35;
      var size = 4 + level * 10;
      ctx.fillStyle = i % 2 ? "#e11d48" : "#fb7185";
      ctx.globalAlpha = 0.4 + level * 0.6;
      // heart-ish diamond
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.bezierCurveTo(x + size, y - size, x + size, y + size/2, x, y + size);
      ctx.bezierCurveTo(x - size, y + size/2, x - size, y - size, x, y - size);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    var bass = muestra(data, 0, 8) / 255;
    ctx.fillStyle = "rgba(225,29,72," + (0.06 + bass * 0.12) + ")";
    ctx.fillRect(0, h * 0.7, w, h * 0.3);
    return true;
  };

  
  var layer = document.createElement("div"); layer.className = "pp-seasonal-fx-layer"; document.body.appendChild(layer);
  function heart() {
    if (document.hidden || layer.children.length > 28) return;
    var p = document.createElement("span"); p.textContent = Math.random()>0.6?"💖":"♥";
    p.style.cssText = "position:absolute;top:-16px;left:"+Math.random()*100+"%;font-size:"+(10+Math.random()*14)+"px;color:"+(Math.random()>0.4?"#e11d48":"#fb7185")+";animation:pp-hf linear forwards;animation-duration:"+(7+Math.random()*6)+"s";
    layer.appendChild(p); setTimeout(function(){p.remove();},14000);
  }
  for (var i=0;i<8;i++) heart();
  if (window.__ppHeartTimer) clearInterval(window.__ppHeartTimer);
  window.__ppHeartTimer = setInterval(heart, 700);

  function enableVis() {
    function tryOn() {
      if (window.ProPlayerVis && window.ProPlayerVis.forceMount) { window.ProPlayerVis.forceMount(); return true; }
      return false;
    }
    if (!tryOn()) { var n=0; var iv=setInterval(function(){ if(tryOn()||++n>40) clearInterval(iv); }, 250); }
  }
  enableVis();
  setTimeout(function(){ spin(); }, 400);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    window.__ppSeasonalVisDraw = null; if(window.__ppHeartTimer)clearInterval(window.__ppHeartTimer);
    $(".pp-seasonal-fx-layer").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) { w.classList.remove("pp-logo-spin-once"); w.removeAttribute("data-pp-click"); });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
