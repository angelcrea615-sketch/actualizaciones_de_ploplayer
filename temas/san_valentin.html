<!-- ProPlayer tema San Valentín — inmersivo -->
<style id="pp-tema-style-san_valentin">
html.tema-san_valentin {
  --accent: #e11d48;
  --accent-glow: #e11d4866;
  --bg-main: #0c080a;
  --bg-side: #160c12;
  --bg-card: #160c12cc;
  --bg-secondary: #e11d4822;
  --glass-border: #e11d4833;
}
html.tema-san_valentin body {
  background:
    radial-gradient(ellipse 80% 45% at 50% -5%, #e11d4828 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 100%, #fb718518 0%, transparent 45%),
    #0c080a !important;
}
html.tema-san_valentin aside.sidebar {
  background: linear-gradient(180deg, #e11d4822 0%, transparent 130px), #160c12 !important;
  border-right: 1px solid #e11d4840 !important;
  position: relative;
}
html.tema-san_valentin aside.sidebar::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 3;
  background: linear-gradient(90deg, transparent, #e11d48, #fb7185, #e11d48, transparent);
  box-shadow: 0 2px 12px #e11d4855;
}
html.tema-san_valentin .nav-link.active {
  background: linear-gradient(90deg, #e11d4830, #fb718518) !important;
  box-shadow: inset 3px 0 0 #e11d48;
}
html.tema-san_valentin .nav-link.active .nav-icon { color: #e11d48 !important; }
html.tema-san_valentin .nav-link:hover { background: #e11d4818 !important; }
html.tema-san_valentin .playlist-nav-item:hover { background: #e11d4814 !important; }
html.tema-san_valentin .main-content {
  background: linear-gradient(180deg, #e11d4818 0%, #0c080a 400px) !important;
}
html.tema-san_valentin .search-wrap input {
  border-color: #e11d4840 !important; background: #e11d4812 !important;
}
html.tema-san_valentin .search-wrap input:focus {
  border-color: #e11d48 !important; box-shadow: 0 0 0 3px #e11d4822;
}
html.tema-san_valentin .album-card {
  background: #160c12aa !important; border: 1px solid #e11d4822;
}
html.tema-san_valentin .album-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #e11d4855;
  box-shadow: 0 12px 32px #e11d4828;
  background: #160c12ee !important;
}
html.tema-san_valentin .card-play-btn,
html.tema-san_valentin .btn-play-big {
  background: linear-gradient(135deg, #e11d48, #fb7185) !important;
  box-shadow: 0 6px 24px #e11d4855 !important;
}
html.tema-san_valentin .song-row-pl:hover {
  background: linear-gradient(90deg, #e11d4818, #fb718510) !important;
}
html.tema-san_valentin .player-bar {
  background: linear-gradient(180deg, #e11d4818 0%, transparent 50%), #0c080af5 !important;
  border-top: 2px solid transparent !important;
  border-image: linear-gradient(90deg, #fb7185, #e11d48, #fb7185) 1 !important;
  box-shadow: 0 -8px 28px rgba(0,0,0,.4);
}
html.tema-san_valentin .btn-play-bar {
  background: #e11d48 !important; color: #111 !important;
  box-shadow: 0 0 16px #e11d4855;
}
html.tema-san_valentin #seek-slider {
  background: linear-gradient(to right, #e11d48 var(--seek-progress), #160c12 var(--seek-progress)) !important;
}
html.tema-san_valentin #volume-slider {
  background: linear-gradient(to right, #fb7185 var(--volume-progress), #160c12 var(--volume-progress)) !important;
}
html.tema-san_valentin #footer-art {
  box-shadow: 0 0 0 2px #e11d4844, 0 4px 12px rgba(0,0,0,.4);
}
html.tema-san_valentin #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, #e11d4825, transparent 55%), #0c080a !important;
}
html.tema-san_valentin .auth-card {
  border: 1px solid #e11d4840 !important;
  box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 30px #e11d4815 !important;
  background: #160c12ee !important;
}
html.tema-san_valentin .auth-btn {
  background: linear-gradient(135deg, #e11d48, #fb7185) !important;
}
html.tema-san_valentin .auth-tab.active { border-color: #e11d48 !important; }
html.tema-san_valentin #loading-screen {
  background: radial-gradient(circle at 50% 35%, #e11d4833, #0c080a 65%) !important;
}
html.tema-san_valentin .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #e11d48, #fb7185) !important;
}
html.tema-san_valentin .pp-logo-icon,
html.tema-san_valentin aside.sidebar .w-8,
html.tema-san_valentin #auth-screen .w-10,
html.tema-san_valentin #loading-screen .w-10 {
  background: linear-gradient(135deg, #e11d48, #fb7185) !important;
  box-shadow: 0 0 14px #e11d4855;
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-spin-all 1.1s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-spin-all {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.15); filter: brightness(1.3); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-tema-vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 44;
  background: radial-gradient(ellipse at center, transparent 48%, #0c080a55 100%);
}

@keyframes pp-heart-f {
  0% { transform: translateY(0) scale(.7); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translateY(110vh) scale(1.15); opacity: 0; }
}
.pp-sv-lab {
  font-size: 11px; letter-spacing: .12em; color: #fb7185;
  text-align: center; margin-top: 6px; text-shadow: 0 0 10px rgba(225,29,72,.45);
}
html.tema-san_valentin .pp-logo-icon {
  animation: pp-beat 1.4s ease-in-out infinite;
}
@keyframes pp-beat {
  0%,100% { transform: scale(1); }
  15% { transform: scale(1.12); }
  30% { transform: scale(1); }
  45% { transform: scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-once .pp-logo-icon { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "san_valentin";
  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spin(wrap) {
    var list = wrap ? [wrap] : $(".pp-logo-wrap");
    list.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); spin(w); });
    });
  }
  mark(); bind();
  if (!document.querySelector(".pp-tema-vignette")) {
    var v = document.createElement("div");
    v.className = "pp-tema-vignette";
    document.body.appendChild(v);
  }
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-sv-lab")) {
    var lab = document.createElement("div");
    lab.className = "pp-sv-lab";
    lab.innerHTML = 'Love is playing';
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(lab, ring.nextSibling);
  }
  
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function heart() {
    if (document.hidden || layer.querySelectorAll(".pp-h").length > 32) return;
    var p = document.createElement("span");
    p.className = "pp-h";
    p.textContent = Math.random()>0.65 ? "💖" : "♥";
    p.style.cssText = "position:absolute;top:-20px;left:"+Math.random()*100+"%;font-size:"+(11+Math.random()*16)+"px;color:"+(Math.random()>0.4?"#e11d48":"#fb7185")+";text-shadow:0 0 8px rgba(225,29,72,.5);animation:pp-heart-f linear forwards;animation-duration:"+(7+Math.random()*7)+"s";
    layer.appendChild(p);
    setTimeout(function(){p.remove();},15000);
  }
  for (var i=0;i<12;i++) heart();
  if (window.__ppHeartTimer) clearInterval(window.__ppHeartTimer);
  window.__ppHeartTimer = setInterval(heart, 650);

  setTimeout(function () { spin(); }, 400);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    $(".pp-seasonal-fx-layer, .pp-tema-vignette, .pp-sv-lab").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
    if (window.__ppHeartTimer) clearInterval(window.__ppHeartTimer);
  };
})();
</script>
