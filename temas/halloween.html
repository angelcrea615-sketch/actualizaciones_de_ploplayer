<!-- ProPlayer tema: halloween -->
<style id="pp-tema-style-halloween">
html.tema-halloween { --accent: #ff6b00; --bg-main: #0a0808; --bg-side: #120e0c; }
html.tema-halloween .btn-play-big { box-shadow: 0 4px 22px rgba(255, 107, 0, 0.4) !important; }
.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; }
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-shake .pp-logo-icon { animation: pp-logo-shake 2.8s ease-in-out infinite; }
@keyframes pp-logo-shake {
  0%,90%,100% { transform: translateX(0) rotate(0); }
  92% { transform: translateX(-2px) rotate(-3deg); }
  94% { transform: translateX(2px) rotate(3deg); }
  96% { transform: translateX(-1px) rotate(-2deg); }
  98% { transform: translateX(1px) rotate(1deg); }
}
.pp-seasonal-fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.pp-particle-niebla {
  position: absolute; top: 20%;
  background: rgba(255,120,40,.08); border-radius: 40%;
  filter: blur(10px);
  animation: pp-fog 14s linear forwards;
}
@keyframes pp-fog {
  0% { transform: translateX(-40px); opacity: 0; }
  20% { opacity: .7; }
  80% { opacity: .45; }
  100% { transform: translateX(50vw); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pp-logo-shake .pp-logo-icon, .pp-particle-niebla { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "halloween";
  document.querySelectorAll("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center").forEach(function (el) {
    el.classList.add("pp-logo-wrap", "pp-logo-shake");
    var icon = el.querySelector("div.w-8, div.w-10");
    if (icon) icon.classList.add("pp-logo-icon");
  });
  var r = document.documentElement;
  r.style.setProperty("--accent", "#ff6b00");
  r.style.setProperty("--bg-main", "#0a0808");
  r.style.setProperty("--bg-side", "#120e0c");
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function fog() {
    if (document.hidden || layer.children.length > 12) return;
    var p = document.createElement("span");
    p.className = "pp-particle-niebla";
    p.style.left = Math.random() * 30 + "%";
    p.style.top = 10 + Math.random() * 60 + "%";
    p.style.width = 50 + Math.random() * 90 + "px";
    p.style.height = 24 + Math.random() * 40 + "px";
    layer.appendChild(p);
    setTimeout(function () { p.remove(); }, 15000);
  }
  for (var i = 0; i < 5; i++) fog();
  if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
  window.__ppFogTimer = setInterval(fog, 2200);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
    document.querySelectorAll(".pp-seasonal-fx-layer").forEach(function (e) { e.remove(); });
    document.querySelectorAll(".pp-logo-wrap").forEach(function (w) { w.classList.remove("pp-logo-shake"); });
  };
})();
</script>
