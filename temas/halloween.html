<!-- ProPlayer tema: halloween (rico) -->
<style id="pp-tema-style-halloween">
html.tema-halloween {
  --accent: #ff6b00;
  --bg-main: #0a0706;
  --bg-side: #140e0a;
}
html.tema-halloween body {
  background: radial-gradient(ellipse at bottom, #1a0e08 0%, #0a0706 55%) fixed;
}
html.tema-halloween .btn-play-big {
  box-shadow: 0 4px 26px rgba(255, 107, 0, 0.45) !important;
}
html.tema-halloween aside.sidebar {
  position: relative;
  background: linear-gradient(180deg, rgba(255,107,0,.08), transparent 100px), var(--bg-side) !important;
}
html.tema-halloween aside.sidebar::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #7b2cbf, #ff6b00, #7b2cbf);
  pointer-events: none; z-index: 2;
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-shake .pp-logo-icon { animation: pp-logo-shake 2.8s ease-in-out infinite; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-hw-spin 0.9s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-shake {
  0%,88%,100% { transform: translateX(0) rotate(0); }
  90% { transform: translateX(-3px) rotate(-4deg); }
  92% { transform: translateX(3px) rotate(4deg); }
  94% { transform: translateX(-2px) rotate(-3deg); }
  96% { transform: translateX(2px) rotate(2deg); }
}
@keyframes pp-hw-spin {
  0% { transform: rotateY(0) scale(1); filter: hue-rotate(0deg); }
  50% { transform: rotateY(180deg) scale(1.2); filter: hue-rotate(40deg) brightness(1.3); }
  100% { transform: rotateY(360deg) scale(1); filter: hue-rotate(0deg); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-particle-niebla {
  position: absolute;
  background: rgba(255, 120, 40, 0.1);
  border-radius: 40%;
  filter: blur(12px);
  animation: pp-fog 16s linear forwards;
}
@keyframes pp-fog {
  0% { transform: translateX(-50px); opacity: 0; }
  15% { opacity: 0.75; }
  85% { opacity: 0.4; }
  100% { transform: translateX(55vw); opacity: 0; }
}
.pp-bat {
  position: absolute;
  font-size: 14px;
  opacity: 0.55;
  animation: pp-bat-fly 12s linear forwards;
  pointer-events: none;
}
@keyframes pp-bat-fly {
  0% { transform: translate(0, 0) scaleX(1); opacity: 0; }
  10% { opacity: 0.6; }
  50% { transform: translate(40vw, -30px) scaleX(-1); }
  100% { transform: translate(90vw, 20px) scaleX(1); opacity: 0; }
}
.pp-hw-label {
  font-size: 10px; letter-spacing: .15em; color: #ff6b00; opacity: .65;
  text-align: center; margin-top: 4px;
}
@media (prefers-reduced-motion: reduce) {
  .pp-logo-shake .pp-logo-icon, .pp-logo-spin-once .pp-logo-icon,
  .pp-particle-niebla, .pp-bat { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "halloween";
  function qsAll(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function markLogos() {
    qsAll("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap", "pp-logo-shake");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spinLogo(wrap) {
    var targets = wrap ? [wrap] : qsAll(".pp-logo-wrap");
    targets.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1000);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spinLogo(w || null); };
  function bindClicks() {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        spinLogo(w);
      });
    });
  }
  var r = document.documentElement;
  r.style.setProperty("--accent", "#ff6b00");
  r.style.setProperty("--bg-main", "#0a0706");
  r.style.setProperty("--bg-side", "#140e0a");
  markLogos();
  bindClicks();
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-hw-label")) {
    var lab = document.createElement("div");
    lab.className = "pp-hw-label";
    lab.textContent = "Spooky season";
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(lab, ring.nextSibling);
  }
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function fog() {
    if (document.hidden || layer.querySelectorAll(".pp-particle-niebla").length > 14) return;
    var p = document.createElement("span");
    p.className = "pp-particle-niebla";
    p.style.left = Math.random() * 25 + "%";
    p.style.top = 15 + Math.random() * 55 + "%";
    p.style.width = 60 + Math.random() * 100 + "px";
    p.style.height = 28 + Math.random() * 45 + "px";
    layer.appendChild(p);
    setTimeout(function () { p.remove(); }, 17000);
  }
  function bat() {
    if (document.hidden) return;
    var b = document.createElement("span");
    b.className = "pp-bat";
    b.textContent = "🦇";
    b.style.left = "-5%";
    b.style.top = 10 + Math.random() * 50 + "%";
    b.style.fontSize = 12 + Math.random() * 10 + "px";
    layer.appendChild(b);
    setTimeout(function () { b.remove(); }, 13000);
  }
  for (var i = 0; i < 6; i++) fog();
  if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
  if (window.__ppBatTimer) clearInterval(window.__ppBatTimer);
  window.__ppFogTimer = setInterval(fog, 2000);
  window.__ppBatTimer = setInterval(bat, 4500);
  setTimeout(function () { spinLogo(); }, 500);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
    if (window.__ppBatTimer) clearInterval(window.__ppBatTimer);
    qsAll(".pp-seasonal-fx-layer, .pp-hw-label").forEach(function (e) { e.remove(); });
    qsAll(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-shake", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
