<!-- ProPlayer tema Halloween — inmersivo -->
<style id="pp-tema-style-halloween">
html.tema-halloween {
  --accent: #ff6b00;
  --accent-glow: #ff6b0066;
  --bg-main: #0a0706;
  --bg-side: #140e0a;
  --bg-card: #140e0acc;
  --bg-secondary: #ff6b0022;
  --glass-border: #ff6b0033;
}
html.tema-halloween body {
  background:
    radial-gradient(ellipse 80% 45% at 50% -5%, #ff6b0028 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 100%, #7b2cbf18 0%, transparent 45%),
    #0a0706 !important;
}
html.tema-halloween aside.sidebar {
  background: linear-gradient(180deg, #ff6b0022 0%, transparent 130px), #140e0a !important;
  border-right: 1px solid #ff6b0040 !important;
  position: relative;
}
html.tema-halloween aside.sidebar::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 3;
  background: linear-gradient(90deg, transparent, #ff6b00, #7b2cbf, #ff6b00, transparent);
  box-shadow: 0 2px 12px #ff6b0055;
}
html.tema-halloween .nav-link.active {
  background: linear-gradient(90deg, #ff6b0030, #7b2cbf18) !important;
  box-shadow: inset 3px 0 0 #ff6b00;
}
html.tema-halloween .nav-link.active .nav-icon { color: #ff6b00 !important; }
html.tema-halloween .nav-link:hover { background: #ff6b0018 !important; }
html.tema-halloween .playlist-nav-item:hover { background: #ff6b0014 !important; }
html.tema-halloween .main-content {
  background: linear-gradient(180deg, #ff6b0018 0%, #0a0706 400px) !important;
}
html.tema-halloween .search-wrap input {
  border-color: #ff6b0040 !important; background: #ff6b0012 !important;
}
html.tema-halloween .search-wrap input:focus {
  border-color: #ff6b00 !important; box-shadow: 0 0 0 3px #ff6b0022;
}
html.tema-halloween .album-card {
  background: #140e0aaa !important; border: 1px solid #ff6b0022;
}
html.tema-halloween .album-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #ff6b0055;
  box-shadow: 0 12px 32px #ff6b0028;
  background: #140e0aee !important;
}
html.tema-halloween .card-play-btn,
html.tema-halloween .btn-play-big {
  background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important;
  box-shadow: 0 6px 24px #ff6b0055 !important;
}
html.tema-halloween .song-row-pl:hover {
  background: linear-gradient(90deg, #ff6b0018, #7b2cbf10) !important;
}
html.tema-halloween .player-bar {
  background: linear-gradient(180deg, #ff6b0018 0%, transparent 50%), #0a0706f5 !important;
  border-top: 2px solid transparent !important;
  border-image: linear-gradient(90deg, #7b2cbf, #ff6b00, #7b2cbf) 1 !important;
  box-shadow: 0 -8px 28px rgba(0,0,0,.4);
}
html.tema-halloween .btn-play-bar {
  background: #ff6b00 !important; color: #111 !important;
  box-shadow: 0 0 16px #ff6b0055;
}
html.tema-halloween #seek-slider {
  background: linear-gradient(to right, #ff6b00 var(--seek-progress), #140e0a var(--seek-progress)) !important;
}
html.tema-halloween #volume-slider {
  background: linear-gradient(to right, #7b2cbf var(--volume-progress), #140e0a var(--volume-progress)) !important;
}
html.tema-halloween #footer-art {
  box-shadow: 0 0 0 2px #ff6b0044, 0 4px 12px rgba(0,0,0,.4);
}
html.tema-halloween #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, #ff6b0025, transparent 55%), #0a0706 !important;
}
html.tema-halloween .auth-card {
  border: 1px solid #ff6b0040 !important;
  box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 30px #ff6b0015 !important;
  background: #140e0aee !important;
}
html.tema-halloween .auth-btn {
  background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important;
}
html.tema-halloween .auth-tab.active { border-color: #ff6b00 !important; }
html.tema-halloween #loading-screen {
  background: radial-gradient(circle at 50% 35%, #ff6b0033, #0a0706 65%) !important;
}
html.tema-halloween .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff6b00, #7b2cbf) !important;
}
html.tema-halloween .pp-logo-icon,
html.tema-halloween aside.sidebar .w-8,
html.tema-halloween #auth-screen .w-10,
html.tema-halloween #loading-screen .w-10 {
  background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important;
  box-shadow: 0 0 14px #ff6b0055;
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-spin-all 1.1s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-spin-all {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.15); filter: brightness(1.3); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-tema-vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 44;
  background: radial-gradient(ellipse at center, transparent 48%, #0a070655 100%);
}

@keyframes pp-fog-m {
  0% { transform: translateX(-40px); opacity: 0; }
  20% { opacity: .7; }
  100% { transform: translateX(55vw); opacity: 0; }
}
@keyframes pp-bat {
  0% { transform: translate(0,0); opacity: 0; }
  15% { opacity: .6; }
  100% { transform: translate(95vw, 15px); opacity: 0; }
}
.pp-hw-lab {
  font-size: 11px; letter-spacing: .14em; color: #ff6b00;
  text-align: center; margin-top: 6px; text-shadow: 0 0 10px rgba(255,107,0,.5);
}
html.tema-halloween .pp-logo-icon {
  animation: pp-shake-soft 3s ease-in-out infinite;
}
@keyframes pp-shake-soft {
  0%,90%,100% { transform: rotate(0); }
  92% { transform: rotate(-4deg); }
  94% { transform: rotate(4deg); }
  96% { transform: rotate(-2deg); }
}

@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-once .pp-logo-icon { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "halloween";
  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spin(wrap) {
    var list = wrap ? [wrap] : $(".pp-logo-wrap");
    list.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); spin(w); });
    });
  }
  mark(); bind();
  if (!document.querySelector(".pp-tema-vignette")) {
    var v = document.createElement("div");
    v.className = "pp-tema-vignette";
    document.body.appendChild(v);
  }
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-hw-lab")) {
    var lab = document.createElement("div");
    lab.className = "pp-hw-lab";
    lab.innerHTML = 'Spooky season';
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(lab, ring.nextSibling);
  }
  
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function fog() {
    if (document.hidden || layer.querySelectorAll(".pp-fog").length > 16) return;
    var p = document.createElement("span");
    p.className = "pp-fog";
    p.style.cssText = "position:absolute;left:"+Math.random()*30+"%;top:"+(15+Math.random()*50)+"%;width:"+(70+Math.random()*100)+"px;height:"+(30+Math.random()*50)+"px;background:rgba(255,120,40,.1);border-radius:40%;filter:blur(14px);animation:pp-fog-m 15s linear forwards";
    layer.appendChild(p);
    setTimeout(function(){p.remove();},16000);
  }
  function bat() {
    if (document.hidden) return;
    var b = document.createElement("span");
    b.textContent = "🦇";
    b.style.cssText = "position:absolute;left:-4%;top:"+(10+Math.random()*45)+"%;font-size:"+(13+Math.random()*12)+"px;opacity:.55;animation:pp-bat 11s linear forwards";
    layer.appendChild(b);
    setTimeout(function(){b.remove();},12000);
  }
  for (var i=0;i<7;i++) fog();
  if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
  if (window.__ppBatTimer) clearInterval(window.__ppBatTimer);
  window.__ppFogTimer = setInterval(fog, 1800);
  window.__ppBatTimer = setInterval(bat, 4000);

  setTimeout(function () { spin(); }, 400);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    $(".pp-seasonal-fx-layer, .pp-tema-vignette, .pp-hw-lab").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
    if (window.__ppFogTimer) clearInterval(window.__ppFogTimer);
    if (window.__ppBatTimer) clearInterval(window.__ppBatTimer);
  };
})();
</script>
