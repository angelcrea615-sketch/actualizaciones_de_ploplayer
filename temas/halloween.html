<!-- Halloween: calabazas a pantalla completa; luces fuera del sidebar -->
<style id="pp-tema-style-halloween">
html.tema-halloween {
  --accent: #ff6b00; --accent-glow: rgba(255,107,0,.45);
  --bg-main: #0a0706; --bg-side: #140e0a;
  --bg-secondary: rgba(255,107,0,.12); --glass-border: rgba(255,107,0,.28);
}
html.tema-halloween body {
  background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,107,0,.12) 0%, transparent 50%), #0a0706 !important;
}
html.tema-halloween aside.sidebar {
  background: linear-gradient(180deg, rgba(255,107,0,.1) 0%, transparent 110px), #140e0a !important;
  border-right: 1px solid rgba(255,107,0,.28) !important;
}
html.tema-halloween .nav-link.active {
  background: linear-gradient(90deg, rgba(255,107,0,.28), rgba(123,44,191,.12)) !important;
  box-shadow: inset 3px 0 0 #ff6b00;
}
html.tema-halloween .nav-link.active .nav-icon { color: #ff6b00 !important; }
html.tema-halloween .main-content {
  background: linear-gradient(180deg, rgba(255,107,0,.1) 0%, #0a0706 380px) !important;
}
html.tema-halloween .album-card {
  background: rgba(20,14,10,.75) !important; border: 1px solid rgba(255,107,0,.2);
}
html.tema-halloween .album-card:hover {
  border-color: rgba(255,107,0,.5); box-shadow: 0 10px 28px rgba(255,107,0,.22);
}
html.tema-halloween .card-play-btn, html.tema-halloween .btn-play-big {
  background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important;
  box-shadow: 0 6px 22px rgba(255,107,0,.45) !important;
}
html.tema-halloween .player-bar {
  background: rgba(10,7,6,.94) !important; border-top: 1px solid rgba(255,107,0,.35) !important;
}
html.tema-halloween .btn-play-bar { background: #ff6b00 !important; color: #111 !important; }
html.tema-halloween #seek-slider {
  background: linear-gradient(to right, #ff6b00 var(--seek-progress), #140e0a var(--seek-progress)) !important;
}
html.tema-halloween #volume-slider {
  background: linear-gradient(to right, #7b2cbf var(--volume-progress), #140e0a var(--volume-progress)) !important;
}
html.tema-halloween #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, rgba(255,107,0,.18), transparent 55%), #0a0706 !important;
}
html.tema-halloween .auth-btn { background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important; }
html.tema-halloween #loading-screen {
  background: radial-gradient(circle at 50% 35%, rgba(255,107,0,.25), #0a0706 65%) !important;
}
html.tema-halloween .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff6b00, #7b2cbf) !important;
}
html.tema-halloween .pp-logo-icon,
html.tema-halloween aside.sidebar .w-8,
html.tema-halloween #auth-screen .w-10,
html.tema-halloween #loading-screen .w-10 {
  background: linear-gradient(135deg, #ff6b00, #7b2cbf) !important;
}
html.tema-halloween .pp-logo-icon { animation: pp-shake-soft 3s ease-in-out infinite; }
@keyframes pp-shake-soft {
  0%,90%,100% { transform: rotate(0); }
  92% { transform: rotate(-4deg); }
  94% { transform: rotate(4deg); }
}
.pp-pumpkin {
  position: absolute; line-height: 1;
  animation: pp-pumpkin-float linear forwards;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
  opacity: .9;
}
@keyframes pp-pumpkin-float {
  0% { transform: translateY(0) rotate(-8deg) scale(.7); opacity: 0; }
  8% { opacity: .9; }
  100% { transform: translateY(-110vh) rotate(25deg) scale(1.1); opacity: 0; }
}

.pp-fx-screen {
  position: fixed; inset: 0; pointer-events: none; z-index: 42; overflow: hidden;
}
.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; }
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-spin-all 1.1s cubic-bezier(.4,.05,.5,1) both; transform-style: preserve-3d;
}
@keyframes pp-spin-all {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.15); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-light-strip {
  position: absolute; left: 0; right: 0; height: 6px; pointer-events: none; z-index: 5;
  display: flex; justify-content: space-around; align-items: center; overflow: hidden;
}
.pp-light-strip.top { top: 0; }
.pp-light-strip.bottom { bottom: 0; }
.pp-light-strip span {
  width: 7px; height: 7px; border-radius: 50%;
  box-shadow: 0 0 8px currentColor;
  animation: pp-bulb 1.35s ease-in-out infinite;
}
@keyframes pp-bulb {
  0%,100% { opacity: .35; transform: scale(.85); }
  50% { opacity: 1; transform: scale(1.2); }
}

</style>
<script>
(function () {
  var ID = "halloween";

  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spin(wrap) {
    (wrap ? [wrap] : $(".pp-logo-wrap")).forEach(function (w) {
      w.classList.remove("pp-logo-spin-once"); void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); spin(w); });
    });
  }
  function enableVis() {
    function tryOn() {
      if (window.ProPlayerVis && window.ProPlayerVis.forceMount) { window.ProPlayerVis.forceMount(); return true; }
      return false;
    }
    if (!tryOn()) { var n=0; var iv=setInterval(function(){ if(tryOn()||++n>40) clearInterval(iv); }, 250); }
  }
  function fxLayer() {
    var el = document.querySelector(".pp-fx-screen");
    if (!el) {
      el = document.createElement("div");
      el.className = "pp-fx-screen";
      el.setAttribute("aria-hidden", "true");
      document.body.appendChild(el);
    }
    return el;
  }
  function placeLights(colors) {
    function strip(host, where) {
      if (!host || host.querySelector(".pp-light-strip")) return;
      if (host.closest && host.closest("aside.sidebar")) return; // nunca sidebar
      if (window.getComputedStyle(host).position === "static") host.style.position = "relative";
      var row = document.createElement("div");
      row.className = "pp-light-strip " + (where || "top");
      for (var i = 0; i < 14; i++) {
        var s = document.createElement("span");
        s.style.color = colors[i % colors.length];
        s.style.background = colors[i % colors.length];
        s.style.animationDelay = (i * 0.12) + "s";
        row.appendChild(s);
      }
      host.appendChild(row);
    }
    strip(document.querySelector(".player-bar"), "top");
    strip(document.querySelector(".main-content"), "top");
    strip(document.getElementById("loading-screen"), "top");
    var auth = document.querySelector("#auth-screen .auth-card");
    if (auth) strip(auth, "top");
  }

  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
    var w = canvas.width, h = canvas.height, n = 36, muestra = api.muestra, sens = api.sensitivity || 1.6;
    for (var i = 0; i < n; i++) {
      var prom = muestra(data, i, n);
      var level = Math.min(1, (prom / 255) * sens);
      var x = ((i + 0.5) / n) * w;
      var barH = Math.max(2, level * h * 0.9);
      ctx.fillStyle = "hsl(" + (18 + level * 28) + ",100%," + (42 + level * 22) + "%)";
      ctx.shadowColor = "#ff6b00"; ctx.shadowBlur = 6 * level;
      ctx.fillRect(x - 2.5, h - barH, 5, barH);
    }
    ctx.shadowBlur = 0;
    return true;
  };
  function pumpkins() {
    var layer = fxLayer();
    function one() {
      if (document.hidden || layer.querySelectorAll(".pp-pumpkin").length > 20) return;
      var p = document.createElement("span");
      p.className = "pp-pumpkin";
      p.textContent = "🎃";
      var size = 18 + Math.random() * 30;
      p.style.left = Math.random() * 100 + "%";
      p.style.bottom = "-48px";
      p.style.fontSize = size + "px";
      p.style.animationDuration = (8 + Math.random() * 10) + "s";
      layer.appendChild(p);
      setTimeout(function () { p.remove(); }, 19000);
    }
    for (var i = 0; i < 7; i++) one();
    if (window.__ppPumpkinTimer) clearInterval(window.__ppPumpkinTimer);
    window.__ppPumpkinTimer = setInterval(one, 1100);
  }
  mark(); bind();
  placeLights(["#ff6b00", "#7b2cbf", "#f5c542", "#ff6b00"]);
  pumpkins();
  enableVis();
  setTimeout(function () { spin(); }, 400);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    window.__ppSeasonalVisDraw = null;
    if (window.__ppPumpkinTimer) clearInterval(window.__ppPumpkinTimer);
    document.querySelectorAll(".pp-fx-screen, .pp-light-strip").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-once"); w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
