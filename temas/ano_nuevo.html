<!-- ProPlayer tema Año Nuevo — inmersivo -->
<style id="pp-tema-style-ano_nuevo">
html.tema-ano_nuevo {
  --accent: #f5c542;
  --accent-glow: #f5c54266;
  --bg-main: #06060a;
  --bg-side: #0c0c14;
  --bg-card: #0c0c14cc;
  --bg-secondary: #f5c54222;
  --glass-border: #f5c54233;
}
html.tema-ano_nuevo body {
  background:
    radial-gradient(ellipse 80% 45% at 50% -5%, #f5c54228 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 100%, #e8e8e818 0%, transparent 45%),
    #06060a !important;
}
html.tema-ano_nuevo aside.sidebar {
  background: linear-gradient(180deg, #f5c54222 0%, transparent 130px), #0c0c14 !important;
  border-right: 1px solid #f5c54240 !important;
  position: relative;
}
html.tema-ano_nuevo aside.sidebar::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 3;
  background: linear-gradient(90deg, transparent, #f5c542, #e8e8e8, #f5c542, transparent);
  box-shadow: 0 2px 12px #f5c54255;
}
html.tema-ano_nuevo .nav-link.active {
  background: linear-gradient(90deg, #f5c54230, #e8e8e818) !important;
  box-shadow: inset 3px 0 0 #f5c542;
}
html.tema-ano_nuevo .nav-link.active .nav-icon { color: #f5c542 !important; }
html.tema-ano_nuevo .nav-link:hover { background: #f5c54218 !important; }
html.tema-ano_nuevo .playlist-nav-item:hover { background: #f5c54214 !important; }
html.tema-ano_nuevo .main-content {
  background: linear-gradient(180deg, #f5c54218 0%, #06060a 400px) !important;
}
html.tema-ano_nuevo .search-wrap input {
  border-color: #f5c54240 !important; background: #f5c54212 !important;
}
html.tema-ano_nuevo .search-wrap input:focus {
  border-color: #f5c542 !important; box-shadow: 0 0 0 3px #f5c54222;
}
html.tema-ano_nuevo .album-card {
  background: #0c0c14aa !important; border: 1px solid #f5c54222;
}
html.tema-ano_nuevo .album-card:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #f5c54255;
  box-shadow: 0 12px 32px #f5c54228;
  background: #0c0c14ee !important;
}
html.tema-ano_nuevo .card-play-btn,
html.tema-ano_nuevo .btn-play-big {
  background: linear-gradient(135deg, #f5c542, #e8e8e8) !important;
  box-shadow: 0 6px 24px #f5c54255 !important;
}
html.tema-ano_nuevo .song-row-pl:hover {
  background: linear-gradient(90deg, #f5c54218, #e8e8e810) !important;
}
html.tema-ano_nuevo .player-bar {
  background: linear-gradient(180deg, #f5c54218 0%, transparent 50%), #06060af5 !important;
  border-top: 2px solid transparent !important;
  border-image: linear-gradient(90deg, #e8e8e8, #f5c542, #e8e8e8) 1 !important;
  box-shadow: 0 -8px 28px rgba(0,0,0,.4);
}
html.tema-ano_nuevo .btn-play-bar {
  background: #f5c542 !important; color: #111 !important;
  box-shadow: 0 0 16px #f5c54255;
}
html.tema-ano_nuevo #seek-slider {
  background: linear-gradient(to right, #f5c542 var(--seek-progress), #0c0c14 var(--seek-progress)) !important;
}
html.tema-ano_nuevo #volume-slider {
  background: linear-gradient(to right, #e8e8e8 var(--volume-progress), #0c0c14 var(--volume-progress)) !important;
}
html.tema-ano_nuevo #footer-art {
  box-shadow: 0 0 0 2px #f5c54244, 0 4px 12px rgba(0,0,0,.4);
}
html.tema-ano_nuevo #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, #f5c54225, transparent 55%), #06060a !important;
}
html.tema-ano_nuevo .auth-card {
  border: 1px solid #f5c54240 !important;
  box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 30px #f5c54215 !important;
  background: #0c0c14ee !important;
}
html.tema-ano_nuevo .auth-btn {
  background: linear-gradient(135deg, #f5c542, #e8e8e8) !important;
}
html.tema-ano_nuevo .auth-tab.active { border-color: #f5c542 !important; }
html.tema-ano_nuevo #loading-screen {
  background: radial-gradient(circle at 50% 35%, #f5c54233, #06060a 65%) !important;
}
html.tema-ano_nuevo .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #f5c542, #e8e8e8) !important;
}
html.tema-ano_nuevo .pp-logo-icon,
html.tema-ano_nuevo aside.sidebar .w-8,
html.tema-ano_nuevo #auth-screen .w-10,
html.tema-ano_nuevo #loading-screen .w-10 {
  background: linear-gradient(135deg, #f5c542, #e8e8e8) !important;
  box-shadow: 0 0 14px #f5c54255;
}
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; }
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-spin-all 1.1s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-spin-all {
  0% { transform: rotateY(0) scale(1); }
  45% { transform: rotateY(180deg) scale(1.15); filter: brightness(1.3); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-tema-vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 44;
  background: radial-gradient(ellipse at center, transparent 48%, #06060a55 100%);
}

@keyframes pp-fall-c {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(110vh) rotate(800deg); opacity: 0.1; }
}
.pp-ny-lab {
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: #f5c542; text-align: center; margin-top: 6px;
  text-shadow: 0 0 12px rgba(245,197,66,.5);
  animation: pp-pulse-lab 2s ease-in-out infinite;
}
@keyframes pp-pulse-lab { 0%,100%{opacity:.5} 50%{opacity:1} }
html.tema-ano_nuevo .pp-logo-icon {
  animation: pp-glow-ny 2s ease-in-out infinite;
}
@keyframes pp-glow-ny {
  0%,100% { box-shadow: 0 0 8px rgba(245,197,66,.4); }
  50% { box-shadow: 0 0 22px 6px rgba(245,197,66,.65); }
}

@media (prefers-reduced-motion: reduce) {
  .pp-logo-spin-once .pp-logo-icon { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "ano_nuevo";
  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function spin(wrap) {
    var list = wrap ? [wrap] : $(".pp-logo-wrap");
    list.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spin(w || null); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); spin(w); });
    });
  }
  mark(); bind();
  if (!document.querySelector(".pp-tema-vignette")) {
    var v = document.createElement("div");
    v.className = "pp-tema-vignette";
    document.body.appendChild(v);
  }
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-ny-lab")) {
    var lab = document.createElement("div");
    lab.className = "pp-ny-lab";
    lab.innerHTML = 'Happy New Year';
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(lab, ring.nextSibling);
  }
  
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  var colors = ["#f5c542","#e8e8e8","#ff6b6b","#4f46e5","#22c55e","#f472b6"];
  function confeti() {
    if (document.hidden || layer.querySelectorAll(".pp-p").length > 45) return;
    var p = document.createElement("span");
    p.className = "pp-p";
    var s = 4 + Math.random()*9;
    p.style.cssText = "position:absolute;top:-16px;left:"+Math.random()*100+"%;width:"+s+"px;height:"+(s*0.5)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";border-radius:2px;animation:pp-fall-c linear forwards;animation-duration:"+(5+Math.random()*7)+"s";
    layer.appendChild(p);
    setTimeout(function(){p.remove();},14000);
  }
  for (var i=0;i<16;i++) confeti();
  if (window.__ppConfetiTimer) clearInterval(window.__ppConfetiTimer);
  window.__ppConfetiTimer = setInterval(confeti, 400);
  var _old = window.__ppTemaCleanup && window.__ppTemaCleanup["ano_nuevo"];

  var _c = window.__ppTemaCleanup && window.__ppTemaCleanup["ano_nuevo"];

  setTimeout(function () { spin(); }, 400);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    $(".pp-seasonal-fx-layer, .pp-tema-vignette, .pp-ny-lab").forEach(function (e) { e.remove(); });
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
    if (window.__ppConfetiTimer) clearInterval(window.__ppConfetiTimer);
  };
})();
</script>
