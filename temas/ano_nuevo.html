<!-- ProPlayer tema: año nuevo (rico) -->
<style id="pp-tema-style-ano_nuevo">
html.tema-ano_nuevo {
  --accent: #f5c542;
  --bg-main: #06060a;
  --bg-side: #0c0c14;
}
html.tema-ano_nuevo body {
  background: radial-gradient(ellipse at top, #1a1520 0%, #06060a 60%) fixed;
}
html.tema-ano_nuevo .btn-play-big {
  box-shadow: 0 4px 28px rgba(245, 197, 66, 0.5) !important;
}
html.tema-ano_nuevo .nav-link.active .nav-icon { color: #f5c542; }
html.tema-ano_nuevo aside.sidebar::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #f5c542, #e8e8e8, #f5c542, transparent);
  pointer-events: none; z-index: 2;
}
html.tema-ano_nuevo aside.sidebar { position: relative; }
.pp-logo-wrap {
  position: relative; display: inline-flex; align-items: center; gap: .75rem;
  cursor: pointer; user-select: none;
}
.pp-logo-icon { position: relative; overflow: visible !important; border-radius: 10px; }
.pp-logo-glow .pp-logo-icon {
  animation: pp-logo-glow-pulse 2.2s ease-in-out infinite;
}
.pp-logo-spin-once .pp-logo-icon {
  animation: pp-ny-spin 1.1s cubic-bezier(.4,.05,.5,1) both;
  transform-style: preserve-3d;
}
@keyframes pp-logo-glow-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,197,66,.35); filter: brightness(1); }
  50% { box-shadow: 0 0 22px 6px rgba(245,197,66,.55); filter: brightness(1.2); }
}
@keyframes pp-ny-spin {
  0% { transform: rotateY(0) scale(1); }
  40% { transform: rotateY(180deg) scale(1.15); filter: brightness(1.4); }
  100% { transform: rotateY(360deg) scale(1); }
}
.pp-seasonal-fx-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden;
}
.pp-particle-confeti {
  position: absolute; top: -20px; border-radius: 2px;
  animation: pp-fall-confeti linear forwards;
}
@keyframes pp-fall-confeti {
  0% { transform: translateY(0) rotate(0) scale(1); opacity: 0; }
  8% { opacity: 1; }
  100% { transform: translateY(108vh) rotate(900deg) scale(.8); opacity: .1; }
}
.pp-firework {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  box-shadow: 0 0 12px 4px currentColor;
  animation: pp-fw 1.2s ease-out forwards;
  pointer-events: none;
}
@keyframes pp-fw {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(8); opacity: 0; }
}
.pp-ny-banner {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: #f5c542; opacity: .7; text-align: center; margin-top: 4px;
  animation: pp-ny-blink 2s ease-in-out infinite;
}
@keyframes pp-ny-blink {
  0%,100% { opacity: .4; }
  50% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .pp-logo-glow .pp-logo-icon, .pp-logo-spin-once .pp-logo-icon,
  .pp-particle-confeti, .pp-firework, .pp-ny-banner { animation: none !important; }
}
</style>
<script>
(function () {
  var ID = "ano_nuevo";
  var colors = ["#f5c542", "#e8e8e8", "#ff6b6b", "#4f46e5", "#22c55e", "#f472b6"];
  function qsAll(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function markLogos() {
    qsAll("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      el.classList.add("pp-logo-wrap", "pp-logo-glow");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) icon.classList.add("pp-logo-icon");
    });
  }
  function firework(x, y) {
    var layer = document.querySelector(".pp-seasonal-fx-layer") || document.body;
    for (var i = 0; i < 10; i++) {
      var f = document.createElement("span");
      f.className = "pp-firework";
      f.style.left = x + (Math.random() - 0.5) * 60 + "px";
      f.style.top = y + (Math.random() - 0.5) * 40 + "px";
      f.style.color = colors[Math.floor(Math.random() * colors.length)];
      f.style.background = f.style.color;
      layer.appendChild(f);
      (function (n) { setTimeout(function () { n.remove(); }, 1300); })(f);
    }
  }
  function spinLogo(wrap) {
    var targets = wrap ? [wrap] : qsAll(".pp-logo-wrap");
    targets.forEach(function (w) {
      w.classList.remove("pp-logo-spin-once");
      void w.offsetWidth;
      w.classList.add("pp-logo-spin-once");
      var r = w.getBoundingClientRect();
      firework(r.left + r.width / 2, r.top + r.height / 2);
      setTimeout(function () { w.classList.remove("pp-logo-spin-once"); }, 1200);
    });
  }
  window.__ppTriggerLogoAnim = function (w) { spinLogo(w || null); };
  function bindClicks() {
    qsAll(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        spinLogo(w);
      });
    });
  }
  var r = document.documentElement;
  r.style.setProperty("--accent", "#f5c542");
  r.style.setProperty("--bg-main", "#06060a");
  r.style.setProperty("--bg-side", "#0c0c14");
  markLogos();
  bindClicks();
  var ls = document.getElementById("loading-screen");
  if (ls && !ls.querySelector(".pp-ny-banner")) {
    var b = document.createElement("div");
    b.className = "pp-ny-banner";
    b.textContent = "Happy New Year";
    var ring = ls.querySelector(".loader-ring");
    if (ring) ring.parentNode.insertBefore(b, ring.nextSibling);
  }
  var layer = document.createElement("div");
  layer.className = "pp-seasonal-fx-layer";
  document.body.appendChild(layer);
  function confeti() {
    if (document.hidden || layer.querySelectorAll(".pp-particle-confeti").length > 40) return;
    var p = document.createElement("span");
    p.className = "pp-particle-confeti";
    var s = 4 + Math.random() * 9;
    p.style.left = Math.random() * 100 + "%";
    p.style.width = s + "px";
    p.style.height = (s * 0.55) + "px";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (5 + Math.random() * 7) + "s";
    layer.appendChild(p);
    setTimeout(function () { p.remove(); }, 13000);
  }
  for (var i = 0; i < 14; i++) confeti();
  if (window.__ppConfetiTimer) clearInterval(window.__ppConfetiTimer);
  window.__ppConfetiTimer = setInterval(confeti, 420);
  setTimeout(function () { spinLogo(); }, 500);
  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    if (window.__ppConfetiTimer) clearInterval(window.__ppConfetiTimer);
    qsAll(".pp-seasonal-fx-layer, .pp-ny-banner, .pp-firework").forEach(function (e) { e.remove(); });
    qsAll(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-glow", "pp-logo-spin-once");
      w.removeAttribute("data-pp-click");
    });
    window.__ppTriggerLogoAnim = null;
  };
})();
</script>
