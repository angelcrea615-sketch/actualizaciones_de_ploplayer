<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Verano</title><meta name="description" content="Sol radiante, ondas y burbujas luminosas"><style>/* ProPlayer Seasonal Theme: Verano */
:root[data-seasonal-theme="summer"] { color-scheme:dark; --pp-season-bg:#061923; --pp-season-side:#0c3444; --pp-season-accent:#35d7ed; --pp-season-text:#e8fcff; }
html[data-seasonal-theme="summer"] body { background:#061923 !important; color:#e8fcff; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="summer"] .main-content { background:radial-gradient(ellipse at 78% 0%,#35d7ed24,transparent 38%),linear-gradient(180deg,#0c3444 0%,#061923 490px) !important; }
html[data-seasonal-theme="summer"] .sidebar { background:linear-gradient(180deg,#0c3444, #061923) !important; border-right:1px solid #35d7ed55 !important; }
html[data-seasonal-theme="summer"] .player-bar { background:linear-gradient(95deg,#0c3444,#061923) !important; border-top:1px solid #35d7ed66 !important; box-shadow:0 -8px 32px #35d7ed12; }
html[data-seasonal-theme="summer"] .album-card { background:linear-gradient(145deg,#35d7ed18,rgba(255,255,255,.025)) !important; border:1px solid #35d7ed35 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="summer"] .album-card:hover { transform:translateY(-5px); border-color:#35d7edaa !important; box-shadow:0 14px 32px #35d7ed20; }
html[data-seasonal-theme="summer"] .nav-link.active { background:linear-gradient(90deg,#35d7ed35,transparent) !important; color:#e8fcff !important; }
html[data-seasonal-theme="summer"] .nav-link.active .nav-icon { color:#35d7ed !important; }
html[data-seasonal-theme="summer"] .btn-play-big,html[data-seasonal-theme="summer"] .card-play-btn { background:linear-gradient(135deg,#35d7ed, #0c3444) !important; color:#e8fcff !important; box-shadow:0 0 25px #35d7ed45; }
html[data-seasonal-theme="summer"] .section-title { color:#e8fcff; text-shadow:0 2px 18px #35d7ed35; }
html[data-seasonal-theme="summer"] .search-wrap input:focus { border-color:#35d7ed !important; box-shadow:0 0 0 3px #35d7ed30 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#35d7ed; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #35d7ed88; animation:pp-sun-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-sun-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="summer"] .main-content { animation:pp-sun-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-sun-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="summer"] .main-content { animation:none !important; } html[data-seasonal-theme="summer"] .album-card { transition:none !important; } }
</style></head><body><div class="pp-seasonal-atmosphere" aria-hidden="true"><span class="pp-particle p0">☀</span><span class="pp-particle p1">✦</span><span class="pp-particle p2">〰</span><span class="pp-particle p3">☀</span><span class="pp-particle p4">✦</span><span class="pp-particle p0">〰</span><span class="pp-particle p1">☀</span><span class="pp-particle p2">✦</span><span class="pp-particle p3">〰</span><span class="pp-particle p4">☀</span><span class="pp-particle p0">✦</span><span class="pp-particle p1">〰</span><span class="pp-particle p2">☀</span><span class="pp-particle p3">✦</span><span class="pp-particle p4">〰</span><span class="pp-particle p0">☀</span><span class="pp-particle p1">✦</span><span class="pp-particle p2">〰</span></div></body></html>
