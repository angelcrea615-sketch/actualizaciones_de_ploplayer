<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Halloween</title><meta name="description" content="Luna, murciélagos y niebla violeta"><style>/* ProPlayer Seasonal Theme: Halloween */
:root[data-seasonal-theme="halloween"] { color-scheme:dark; --pp-season-bg:#10091b; --pp-season-side:#26123a; --pp-season-accent:#b78aff; --pp-season-text:#f5edff; }
html[data-seasonal-theme="halloween"] body { background:#10091b !important; color:#f5edff; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="halloween"] .main-content { background:radial-gradient(ellipse at 78% 0%,#b78aff24,transparent 38%),linear-gradient(180deg,#26123a 0%,#10091b 490px) !important; }
html[data-seasonal-theme="halloween"] .sidebar { background:linear-gradient(180deg,#26123a, #10091b) !important; border-right:1px solid #b78aff55 !important; }
html[data-seasonal-theme="halloween"] .player-bar { background:linear-gradient(95deg,#26123a,#10091b) !important; border-top:1px solid #b78aff66 !important; box-shadow:0 -8px 32px #b78aff12; }
html[data-seasonal-theme="halloween"] .album-card { background:linear-gradient(145deg,#b78aff18,rgba(255,255,255,.025)) !important; border:1px solid #b78aff35 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="halloween"] .album-card:hover { transform:translateY(-5px); border-color:#b78affaa !important; box-shadow:0 14px 32px #b78aff20; }
html[data-seasonal-theme="halloween"] .nav-link.active { background:linear-gradient(90deg,#b78aff35,transparent) !important; color:#f5edff !important; }
html[data-seasonal-theme="halloween"] .nav-link.active .nav-icon { color:#b78aff !important; }
html[data-seasonal-theme="halloween"] .btn-play-big,html[data-seasonal-theme="halloween"] .card-play-btn { background:linear-gradient(135deg,#b78aff, #26123a) !important; color:#f5edff !important; box-shadow:0 0 25px #b78aff45; }
html[data-seasonal-theme="halloween"] .section-title { color:#f5edff; text-shadow:0 2px 18px #b78aff35; }
html[data-seasonal-theme="halloween"] .search-wrap input:focus { border-color:#b78aff !important; box-shadow:0 0 0 3px #b78aff30 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#b78aff; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #b78aff88; animation:pp-spook-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-spook-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="halloween"] .main-content { animation:pp-spook-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-spook-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="halloween"] .main-content { animation:none !important; } html[data-seasonal-theme="halloween"] .album-card { transition:none !important; } }
