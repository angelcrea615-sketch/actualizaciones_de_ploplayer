<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Halloween</title><style>

      .pp-seasonal-active body{transition:background .5s,color .4s}.pp-seasonal-active .sidebar,.pp-seasonal-active .player-bar,.pp-seasonal-active .main-content{transition:background .55s,border-color .4s}
      body{background:#100b18}.main-content{background:radial-gradient(ellipse at 75% 0%,rgba(168,85,247,.2),transparent 40%),linear-gradient(180deg,#241337,#100b18 450px)!important}.sidebar{background:linear-gradient(180deg,#21112f,#130c1d)!important;border-right:1px solid rgba(168,85,247,.22)}.player-bar{background:linear-gradient(90deg,#1b1028,#30153d)!important;border-top:1px solid rgba(168,85,247,.25)}.album-card{border:1px solid rgba(168,85,247,.18);background:linear-gradient(145deg,rgba(168,85,247,.13),rgba(255,255,255,.02))}.nav-link.active{background:rgba(168,85,247,.2)}.btn-play-big,.card-play-btn{background:linear-gradient(135deg,#c084fc,#7e22ce)!important;box-shadow:0 0 25px rgba(168,85,247,.25)}#pp-theme-decor-layer:before{content:'☾';position:fixed;right:7%;top:12%;font-size:100px;color:#c4b5fd;opacity:.16;pointer-events:none}#pp-theme-decor-layer:after{content:'✦  ·  ✧   ·  ✦';position:fixed;left:12%;bottom:20%;font-size:30px;letter-spacing:18px;color:#a78bfa;opacity:.2;pointer-events:none}
      @keyframes pp-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(18px) rotate(5deg)}}@keyframes pp-heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes pp-bloom{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(12deg) scale(1.1)}}@keyframes pp-sun{to{transform:rotate(360deg)}}@keyframes pp-leaf{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(24px) rotate(12deg)}}
      @media(prefers-reduced-motion:reduce){#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{animation:none!important}}
      
</style></head><body>
<div class="pp-theme-atmosphere" aria-hidden="true"></div>
</body></html>
