<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Año nuevo</title><meta name="description" content="Confeti dorado, destellos y ambiente de medianoche"><style>/* ProPlayer Seasonal Theme: Año nuevo */
:root[data-seasonal-theme="new-year"] { color-scheme:dark; --pp-season-bg:#080d1c; --pp-season-side:#151d35; --pp-season-accent:#f5c542; --pp-season-text:#fff7dc; }
html[data-seasonal-theme="new-year"] body { background:#080d1c !important; color:#fff7dc; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="new-year"] .main-content { background:radial-gradient(ellipse at 78% 0%,#f5c54224,transparent 38%),linear-gradient(180deg,#151d35 0%,#080d1c 490px) !important; }
html[data-seasonal-theme="new-year"] .sidebar { background:linear-gradient(180deg,#151d35, #080d1c) !important; border-right:1px solid #f5c54255 !important; }
html[data-seasonal-theme="new-year"] .player-bar { background:linear-gradient(95deg,#151d35,#080d1c) !important; border-top:1px solid #f5c54266 !important; box-shadow:0 -8px 32px #f5c54212; }
html[data-seasonal-theme="new-year"] .album-card { background:linear-gradient(145deg,#f5c54218,rgba(255,255,255,.025)) !important; border:1px solid #f5c54235 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="new-year"] .album-card:hover { transform:translateY(-5px); border-color:#f5c542aa !important; box-shadow:0 14px 32px #f5c54220; }
html[data-seasonal-theme="new-year"] .nav-link.active { background:linear-gradient(90deg,#f5c54235,transparent) !important; color:#fff7dc !important; }
html[data-seasonal-theme="new-year"] .nav-link.active .nav-icon { color:#f5c542 !important; }
html[data-seasonal-theme="new-year"] .btn-play-big,html[data-seasonal-theme="new-year"] .card-play-btn { background:linear-gradient(135deg,#f5c542, #151d35) !important; color:#fff7dc !important; box-shadow:0 0 25px #f5c54245; }
html[data-seasonal-theme="new-year"] .section-title { color:#fff7dc; text-shadow:0 2px 18px #f5c54235; }
html[data-seasonal-theme="new-year"] .search-wrap input:focus { border-color:#f5c542 !important; box-shadow:0 0 0 3px #f5c54230 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#f5c542; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #f5c54288; animation:pp-spark-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-spark-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="new-year"] .main-content { animation:pp-spark-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-spark-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="new-year"] .main-content { animation:none !important; } html[data-seasonal-theme="new-year"] .album-card { transition:none !important; } }
</style></head><body><div class="pp-seasonal-atmosphere" aria-hidden="true"><span class="pp-particle p0">✦</span><span class="pp-particle p1">✧</span><span class="pp-particle p2">★</span><span class="pp-particle p3">✦</span><span class="pp-particle p4">✧</span><span class="pp-particle p0">★</span><span class="pp-particle p1">✦</span><span class="pp-particle p2">✧</span><span class="pp-particle p3">★</span><span class="pp-particle p4">✦</span><span class="pp-particle p0">✧</span><span class="pp-particle p1">★</span><span class="pp-particle p2">✦</span><span class="pp-particle p3">✧</span><span class="pp-particle p4">★</span><span class="pp-particle p0">✦</span><span class="pp-particle p1">✧</span><span class="pp-particle p2">★</span></div></body></html>
