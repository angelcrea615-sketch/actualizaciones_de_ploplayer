<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Año nuevo</title><style>

      .pp-seasonal-active body{transition:background .5s,color .4s}.pp-seasonal-active .sidebar,.pp-seasonal-active .player-bar,.pp-seasonal-active .main-content{transition:background .55s,border-color .4s}
      body{background:#090d18}.main-content{background:radial-gradient(ellipse at 80% 0%,rgba(234,179,8,.13),transparent 36%),linear-gradient(180deg,#151b2b,#090d18 440px)!important}.sidebar{background:linear-gradient(180deg,#171d30,#0d1220)!important;border-right:1px solid rgba(234,179,8,.18)}.player-bar{background:linear-gradient(90deg,#111827,#28200f)!important;border-top:1px solid rgba(234,179,8,.25)}.album-card{border:1px solid rgba(234,179,8,.13);background:linear-gradient(145deg,rgba(234,179,8,.08),rgba(255,255,255,.02))}.nav-link.active{background:linear-gradient(90deg,rgba(234,179,8,.2),transparent)}.btn-play-big,.card-play-btn{background:linear-gradient(135deg,#facc15,#b7791f)!important;color:#17120a!important;box-shadow:0 0 24px rgba(234,179,8,.2)}#pp-theme-decor-layer:before{content:'✦  ·  ✧     ·      ✦';position:fixed;inset:12% 5% auto auto;color:#facc15;opacity:.28;font-size:28px;letter-spacing:24px;pointer-events:none;animation:pp-drift 8s ease-in-out infinite}
      @keyframes pp-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(18px) rotate(5deg)}}@keyframes pp-heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes pp-bloom{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(12deg) scale(1.1)}}@keyframes pp-sun{to{transform:rotate(360deg)}}@keyframes pp-leaf{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(24px) rotate(12deg)}}
      @media(prefers-reduced-motion:reduce){#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{animation:none!important}}
      
</style></head><body>
<div class="pp-theme-atmosphere" aria-hidden="true"></div>
</body></html>
