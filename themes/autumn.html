<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Otoño</title><style>

      .pp-seasonal-active body{transition:background .5s,color .4s}.pp-seasonal-active .sidebar,.pp-seasonal-active .player-bar,.pp-seasonal-active .main-content{transition:background .55s,border-color .4s}
      body{background:#1a1009}.main-content{background:radial-gradient(ellipse at 80% 0%,rgba(249,115,22,.18),transparent 38%),linear-gradient(180deg,#382012,#1a1009 450px)!important}.sidebar{background:linear-gradient(180deg,#321d10,#1d120b)!important;border-right:1px solid rgba(249,115,22,.2)}.player-bar{background:linear-gradient(90deg,#28180e,#422311)!important;border-top:1px solid rgba(249,115,22,.25)}.album-card{border:1px solid rgba(249,115,22,.16);background:linear-gradient(145deg,rgba(249,115,22,.12),rgba(255,255,255,.02))}.nav-link.active{background:rgba(249,115,22,.18)}.btn-play-big,.card-play-btn{background:linear-gradient(135deg,#fb923c,#c2410c)!important;box-shadow:0 0 22px rgba(249,115,22,.2)}#pp-theme-decor-layer:before{content:'🍂   🍁      🍂';position:fixed;right:3%;top:18%;font-size:30px;letter-spacing:12px;opacity:.2;pointer-events:none;animation:pp-leaf 9s ease-in-out infinite}
      @keyframes pp-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(18px) rotate(5deg)}}@keyframes pp-heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes pp-bloom{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(12deg) scale(1.1)}}@keyframes pp-sun{to{transform:rotate(360deg)}}@keyframes pp-leaf{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(24px) rotate(12deg)}}
      @media(prefers-reduced-motion:reduce){#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{animation:none!important}}
      
</style></head><body>
<div class="pp-theme-atmosphere" aria-hidden="true"></div>
</body></html>
