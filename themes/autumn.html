<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Otoño</title><meta name="description" content="Hojas que caen lentamente"><style>/* ProPlayer Seasonal Theme: Otoño */
:root[data-seasonal-theme="autumn"] { color-scheme:dark; --pp-season-bg:#1b1009; --pp-season-side:#382012; --pp-season-accent:#f59a38; --pp-season-text:#fff1dc; }
html[data-seasonal-theme="autumn"] body { background:#1b1009 !important; color:#fff1dc; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="autumn"] .main-content { background:radial-gradient(ellipse at 78% 0%,#f59a3824,transparent 38%),linear-gradient(180deg,#382012 0%,#1b1009 490px) !important; }
html[data-seasonal-theme="autumn"] .sidebar { background:linear-gradient(180deg,#382012, #1b1009) !important; border-right:1px solid #f59a3855 !important; }
html[data-seasonal-theme="autumn"] .player-bar { background:linear-gradient(95deg,#382012,#1b1009) !important; border-top:1px solid #f59a3866 !important; box-shadow:0 -8px 32px #f59a3812; }
html[data-seasonal-theme="autumn"] .album-card { background:linear-gradient(145deg,#f59a3818,rgba(255,255,255,.025)) !important; border:1px solid #f59a3835 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="autumn"] .album-card:hover { transform:translateY(-5px); border-color:#f59a38aa !important; box-shadow:0 14px 32px #f59a3820; }
html[data-seasonal-theme="autumn"] .nav-link.active { background:linear-gradient(90deg,#f59a3835,transparent) !important; color:#fff1dc !important; }
html[data-seasonal-theme="autumn"] .nav-link.active .nav-icon { color:#f59a38 !important; }
html[data-seasonal-theme="autumn"] .btn-play-big,html[data-seasonal-theme="autumn"] .card-play-btn { background:linear-gradient(135deg,#f59a38, #382012) !important; color:#fff1dc !important; box-shadow:0 0 25px #f59a3845; }
html[data-seasonal-theme="autumn"] .section-title { color:#fff1dc; text-shadow:0 2px 18px #f59a3835; }
html[data-seasonal-theme="autumn"] .search-wrap input:focus { border-color:#f59a38 !important; box-shadow:0 0 0 3px #f59a3830 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#f59a38; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #f59a3888; animation:pp-leaf-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-leaf-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="autumn"] .main-content { animation:pp-leaf-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-leaf-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="autumn"] .main-content { animation:none !important; } html[data-seasonal-theme="autumn"] .album-card { transition:none !important; } }
</style></head><body><div class="pp-seasonal-atmosphere" aria-hidden="true"><span class="pp-particle p0">🍂</span><span class="pp-particle p1">🍁</span><span class="pp-particle p2">❧</span><span class="pp-particle p3">🍂</span><span class="pp-particle p4">🍁</span><span class="pp-particle p0">❧</span><span class="pp-particle p1">🍂</span><span class="pp-particle p2">🍁</span><span class="pp-particle p3">❧</span><span class="pp-particle p4">🍂</span><span class="pp-particle p0">🍁</span><span class="pp-particle p1">❧</span><span class="pp-particle p2">🍂</span><span class="pp-particle p3">🍁</span><span class="pp-particle p4">❧</span><span class="pp-particle p0">🍂</span><span class="pp-particle p1">🍁</span><span class="pp-particle p2">❧</span></div></body></html>
