<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · San Valentín</title><meta name="description" content="Corazones flotantes y brillo romántico"><style>/* ProPlayer Seasonal Theme: San Valentín */
:root[data-seasonal-theme="valentines"] { color-scheme:dark; --pp-season-bg:#190b17; --pp-season-side:#351329; --pp-season-accent:#ff5b91; --pp-season-text:#fff0f5; }
html[data-seasonal-theme="valentines"] body { background:#190b17 !important; color:#fff0f5; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="valentines"] .main-content { background:radial-gradient(ellipse at 78% 0%,#ff5b9124,transparent 38%),linear-gradient(180deg,#351329 0%,#190b17 490px) !important; }
html[data-seasonal-theme="valentines"] .sidebar { background:linear-gradient(180deg,#351329, #190b17) !important; border-right:1px solid #ff5b9155 !important; }
html[data-seasonal-theme="valentines"] .player-bar { background:linear-gradient(95deg,#351329,#190b17) !important; border-top:1px solid #ff5b9166 !important; box-shadow:0 -8px 32px #ff5b9112; }
html[data-seasonal-theme="valentines"] .album-card { background:linear-gradient(145deg,#ff5b9118,rgba(255,255,255,.025)) !important; border:1px solid #ff5b9135 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="valentines"] .album-card:hover { transform:translateY(-5px); border-color:#ff5b91aa !important; box-shadow:0 14px 32px #ff5b9120; }
html[data-seasonal-theme="valentines"] .nav-link.active { background:linear-gradient(90deg,#ff5b9135,transparent) !important; color:#fff0f5 !important; }
html[data-seasonal-theme="valentines"] .nav-link.active .nav-icon { color:#ff5b91 !important; }
html[data-seasonal-theme="valentines"] .btn-play-big,html[data-seasonal-theme="valentines"] .card-play-btn { background:linear-gradient(135deg,#ff5b91, #351329) !important; color:#fff0f5 !important; box-shadow:0 0 25px #ff5b9145; }
html[data-seasonal-theme="valentines"] .section-title { color:#fff0f5; text-shadow:0 2px 18px #ff5b9135; }
html[data-seasonal-theme="valentines"] .search-wrap input:focus { border-color:#ff5b91 !important; box-shadow:0 0 0 3px #ff5b9130 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#ff5b91; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #ff5b9188; animation:pp-heart-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-heart-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="valentines"] .main-content { animation:pp-heart-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-heart-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="valentines"] .main-content { animation:none !important; } html[data-seasonal-theme="valentines"] .album-card { transition:none !important; } }
</style></head><body><div class="pp-seasonal-atmosphere" aria-hidden="true"><span class="pp-particle p0">♥</span><span class="pp-particle p1">♡</span><span class="pp-particle p2">❤</span><span class="pp-particle p3">♥</span><span class="pp-particle p4">♡</span><span class="pp-particle p0">❤</span><span class="pp-particle p1">♥</span><span class="pp-particle p2">♡</span><span class="pp-particle p3">❤</span><span class="pp-particle p4">♥</span><span class="pp-particle p0">♡</span><span class="pp-particle p1">❤</span><span class="pp-particle p2">♥</span><span class="pp-particle p3">♡</span><span class="pp-particle p4">❤</span><span class="pp-particle p0">♥</span><span class="pp-particle p1">♡</span><span class="pp-particle p2">❤</span></div></body></html>
