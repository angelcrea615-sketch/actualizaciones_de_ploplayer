<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · San Valentín</title><style>

      .pp-seasonal-active body{transition:background .5s,color .4s}.pp-seasonal-active .sidebar,.pp-seasonal-active .player-bar,.pp-seasonal-active .main-content{transition:background .55s,border-color .4s}
      body{background:#170914}.main-content{background:radial-gradient(ellipse at 70% 0%,rgba(244,63,117,.17),transparent 40%),linear-gradient(180deg,#32132b,#170914 460px)!important}.sidebar{background:linear-gradient(180deg,#301329,#1b0c19)!important;border-right:1px solid rgba(244,63,117,.2)}.player-bar{background:linear-gradient(90deg,#260f20,#3a1428)!important;border-top:1px solid rgba(244,63,117,.25)}.album-card{border:1px solid rgba(244,63,117,.15);background:linear-gradient(145deg,rgba(244,63,117,.11),rgba(255,255,255,.02))}.nav-link.active{background:rgba(244,63,117,.17)}.btn-play-big,.card-play-btn{background:linear-gradient(135deg,#fb7185,#be185d)!important;box-shadow:0 0 24px rgba(244,63,117,.25)}#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{content:'♥';position:fixed;color:#fb7185;opacity:.12;font-size:90px;pointer-events:none;animation:pp-heart 7s ease-in-out infinite}#pp-theme-decor-layer:before{right:8%;top:16%}#pp-theme-decor-layer:after{left:27%;bottom:18%;font-size:42px;animation-delay:-3s}
      @keyframes pp-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(18px) rotate(5deg)}}@keyframes pp-heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes pp-bloom{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(12deg) scale(1.1)}}@keyframes pp-sun{to{transform:rotate(360deg)}}@keyframes pp-leaf{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(24px) rotate(12deg)}}
      @media(prefers-reduced-motion:reduce){#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{animation:none!important}}
      
</style></head><body>
<div class="pp-theme-atmosphere" aria-hidden="true"></div>
</body></html>
