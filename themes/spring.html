<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Primavera</title><style>

      .pp-seasonal-active body{transition:background .5s,color .4s}.pp-seasonal-active .sidebar,.pp-seasonal-active .player-bar,.pp-seasonal-active .main-content{transition:background .55s,border-color .4s}
      body{background:#08140f}.main-content{background:radial-gradient(ellipse at 85% 0%,rgba(74,222,128,.14),transparent 38%),linear-gradient(180deg,#153322,#08140f 440px)!important}.sidebar{background:linear-gradient(180deg,#143522,#0a1b12)!important;border-right:1px solid rgba(74,222,128,.18)}.player-bar{background:linear-gradient(90deg,#10291b,#183c28)!important;border-top:1px solid rgba(74,222,128,.2)}.album-card{border:1px solid rgba(74,222,128,.14);background:linear-gradient(145deg,rgba(74,222,128,.09),rgba(255,255,255,.02))}.nav-link.active{background:rgba(74,222,128,.16)}.btn-play-big,.card-play-btn{background:linear-gradient(135deg,#4ade80,#15803d)!important;box-shadow:0 0 22px rgba(74,222,128,.2)}#pp-theme-decor-layer:before{content:'✿   ❀      ✿';position:fixed;right:4%;top:18%;font-size:36px;letter-spacing:22px;color:#86efac;opacity:.22;pointer-events:none;animation:pp-bloom 5s ease-in-out infinite}
      @keyframes pp-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(18px) rotate(5deg)}}@keyframes pp-heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-18px) scale(1.08)}}@keyframes pp-bloom{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(12deg) scale(1.1)}}@keyframes pp-sun{to{transform:rotate(360deg)}}@keyframes pp-leaf{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(24px) rotate(12deg)}}
      @media(prefers-reduced-motion:reduce){#pp-theme-decor-layer:before,#pp-theme-decor-layer:after{animation:none!important}}
      
</style></head><body>
<div class="pp-theme-atmosphere" aria-hidden="true"></div>
</body></html>
