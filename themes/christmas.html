<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Navidad</title><style>

      .pp-seasonal-home-hero {
        display:none; position:relative; min-height:188px; margin:1.2rem 0 1.5rem;
        padding:1.35rem 1.7rem; overflow:hidden; align-items:center; gap:1.35rem;
        border:1px solid rgba(214,181,109,.25); border-radius:22px;
        background:linear-gradient(115deg,rgba(13,49,34,.96),rgba(8,25,19,.92) 58%,rgba(86,22,27,.88));
        box-shadow:0 18px 55px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.06);
      }
      .pp-christmas .pp-seasonal-home-hero { display:flex; }
      .pp-seasonal-home-hero::before {
        content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
        background:radial-gradient(circle at 12% 15%,rgba(214,181,109,.22),transparent 28%),
                   radial-gradient(circle at 88% 90%,rgba(220,55,65,.22),transparent 34%);
      }
      .pp-seasonal-logo-stage { position:relative; z-index:1; width:112px; height:112px; flex:0 0 112px; display:grid; place-items:center; }
      .pp-seasonal-logo-mark {
        position:relative; width:88px; height:88px; display:grid; place-items:center;
        border-radius:25px; background:linear-gradient(145deg,#e04444,#a91f32 58%,#74202a);
        border:1px solid rgba(255,255,255,.3); box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 28px rgba(224,68,68,.2);
        transform-style:preserve-3d; animation:pp-xmas-logo-intro 1.25s cubic-bezier(.2,.8,.2,1) both,pp-xmas-logo-float 4s 1.25s ease-in-out infinite;
      }
      .pp-seasonal-logo-mark svg { width:55px; height:55px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
      .pp-santa-hat { position:absolute; width:53px; height:34px; left:45px; top:-20px; z-index:3; transform-origin:12px 29px; animation:pp-xmas-hat-arrive .85s .62s cubic-bezier(.18,.8,.25,1.3) both; }
      .pp-santa-hat::before { content:""; position:absolute; left:4px; top:7px; width:39px; height:24px; background:linear-gradient(135deg,#f34b50,#b91c2c); border-radius:90% 12% 0 0; transform:rotate(-13deg); clip-path:polygon(0 100%,12% 45%,100% 0,76% 100%); }
      .pp-santa-hat i { position:absolute; left:1px; bottom:0; width:43px; height:9px; background:#fffaf0; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.25); }
      .pp-santa-hat b { position:absolute; right:3px; top:1px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 0 9px rgba(255,255,255,.5); }
      .pp-seasonal-home-copy { position:relative; z-index:1; }
      .pp-seasonal-eyebrow { color:#e4c98c; font-size:.66rem; font-weight:800; letter-spacing:.2em; }
      .pp-seasonal-home-copy h1 { margin:.25rem 0 0; font-size:clamp(1.8rem,4vw,2.8rem); line-height:1.05; font-weight:900; letter-spacing:-.055em; color:#fffaf0; text-shadow:0 3px 20px rgba(0,0,0,.25); }
      .pp-seasonal-greeting { margin:.55rem 0 0; color:rgba(255,250,240,.72); font-size:.92rem; }
      .pp-seasonal-spark { position:absolute; color:#e8d29b; text-shadow:0 0 12px rgba(232,210,155,.7); animation:pp-xmas-sparkle 2.4s ease-in-out infinite; }
      .pp-spark-one { right:13%; top:24%; font-size:1.8rem; }
      .pp-spark-two { right:7%; bottom:19%; font-size:1.2rem; animation-delay:.8s; }
      .pp-christmas body { background:#07130f; }
      .pp-christmas .main-content { background:linear-gradient(180deg,#102b20 0%,#07130f 410px) !important; }
      .pp-christmas .sidebar { background:linear-gradient(180deg,#0d2119,#091811) !important; border-color:rgba(214,181,109,.16); }
      .pp-christmas .player-bar { background:linear-gradient(90deg,rgba(8,30,21,.98),rgba(31,14,20,.98)) !important; border-top-color:rgba(214,181,109,.25); }
      .pp-christmas .album-card { background:linear-gradient(145deg,rgba(20,64,43,.48),rgba(255,255,255,.025)); border:1px solid rgba(214,181,109,.10); }
      .pp-christmas .album-card:hover { border-color:rgba(214,181,109,.4); box-shadow:0 12px 28px rgba(0,0,0,.22); }
      .pp-christmas .section-title { color:#f4fff8; text-shadow:0 2px 14px rgba(214,181,109,.12); }
      .pp-christmas .nav-link.active { background:linear-gradient(90deg,rgba(34,112,71,.35),rgba(180,42,51,.16)); }
      .pp-christmas .nav-link.active .nav-icon { color:#e4c98c; }
      .pp-christmas .btn-play-big, .pp-christmas .card-play-btn { background:linear-gradient(145deg,#e34b50,#b51f32); box-shadow:0 5px 22px rgba(190,35,48,.28); }
      .pp-christmas .btn-play-bar { background:#e8d29b; color:#17251c; }
      .pp-christmas .search-wrap input:focus { border-color:#d6b56d; box-shadow:0 0 0 3px rgba(214,181,109,.15); }
      .pp-christmas .pl-hero { background:linear-gradient(180deg,rgba(23,75,49,.7),transparent); }
      .pp-christmas #home-version-watermark { color:rgba(228,201,140,.55); }
      .pp-christmas #auth-screen { background:radial-gradient(ellipse at 50% 20%,#174b32 0%,#07130f 70%); }
      .pp-christmas .auth-card { border-color:rgba(214,181,109,.25); box-shadow:0 32px 80px rgba(0,0,0,.7),0 0 40px rgba(24,95,59,.12); }
      .pp-christmas .auth-tab.active { border-color:#d6b56d; }
      .pp-christmas .auth-btn { background:linear-gradient(100deg,#b92839,#d94348); }
      .pp-christmas .auth-btn:hover { background:#e34b50; }
      .pp-christmas .overlay-card { border-color:rgba(214,181,109,.2); }
      .pp-christmas #audio-visualizer { filter: drop-shadow(0 0 5px rgba(214,181,109,.2)); }
      .pp-christmas body::after {
        content:""; position:fixed; inset:-30% 0 0; z-index:9998; pointer-events:none; opacity:.38;
        background-image:radial-gradient(2px 2px at 20px 30px,#fff 98%,transparent),radial-gradient(2px 2px at 80px 120px,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 160px 70px,#fff 98%,transparent),radial-gradient(2px 2px at 230px 180px,#fff 98%,transparent),radial-gradient(1px 1px at 300px 40px,#fff 98%,transparent);
        background-size:340px 220px; animation:pp-xmas-snow 18s linear infinite;
      }
      @keyframes pp-xmas-logo-intro { 0% { opacity:0; transform:perspective(500px) rotateY(-180deg) scale(.55); } 65% { opacity:1; transform:perspective(500px) rotateY(18deg) scale(1.08); } 100% { opacity:1; transform:perspective(500px) rotateY(0) scale(1); } }
      @keyframes pp-xmas-hat-arrive { 0% { opacity:0; transform:translate(-12px,-20px) rotate(-38deg) scale(.4); } 70% { opacity:1; transform:translate(2px,3px) rotate(9deg) scale(1.08); } 100% { opacity:1; transform:translate(0,0) rotate(0) scale(1); } }
      @keyframes pp-xmas-logo-float { 0%,100% { translate:0 0; } 50% { translate:0 -5px; } }
      @keyframes pp-xmas-sparkle { 0%,100% { opacity:.35; transform:scale(.8) rotate(0); } 50% { opacity:1; transform:scale(1.2) rotate(18deg); } }
      @keyframes pp-xmas-snow { from { transform:translateY(-5%); } to { transform:translateY(28%); } }
      @media(max-width:640px) { .pp-seasonal-home-hero { min-height:150px; padding:1rem; gap:.7rem; } .pp-seasonal-logo-stage { width:88px;height:88px;flex-basis:88px; } .pp-seasonal-logo-mark { width:70px;height:70px;border-radius:20px; } .pp-seasonal-logo-mark svg { width:45px;height:45px; } .pp-santa-hat { transform:scale(.82); left:35px; top:-21px; } .pp-seasonal-spark { display:none; } }
      @media(prefers-reduced-motion:reduce) { .pp-seasonal-logo-mark,.pp-santa-hat,.pp-seasonal-spark,.pp-christmas body::after { animation:none !important; } }
    
</style></head><body>
<div class="pp-christmas-atmosphere" aria-hidden="true"></div>
</body></html>
