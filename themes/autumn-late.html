<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProPlayer · Otoño tardío</title><meta name="description" content="Brasas cálidas y hojas al viento"><style>/* ProPlayer Seasonal Theme: Otoño tardío */
:root[data-seasonal-theme="autumn-late"] { color-scheme:dark; --pp-season-bg:#17100b; --pp-season-side:#302013; --pp-season-accent:#d7a56b; --pp-season-text:#fff2df; }
html[data-seasonal-theme="autumn-late"] body { background:#17100b !important; color:#fff2df; transition:background .7s ease,color .5s ease; }
html[data-seasonal-theme="autumn-late"] .main-content { background:radial-gradient(ellipse at 78% 0%,#d7a56b24,transparent 38%),linear-gradient(180deg,#302013 0%,#17100b 490px) !important; }
html[data-seasonal-theme="autumn-late"] .sidebar { background:linear-gradient(180deg,#302013, #17100b) !important; border-right:1px solid #d7a56b55 !important; }
html[data-seasonal-theme="autumn-late"] .player-bar { background:linear-gradient(95deg,#302013,#17100b) !important; border-top:1px solid #d7a56b66 !important; box-shadow:0 -8px 32px #d7a56b12; }
html[data-seasonal-theme="autumn-late"] .album-card { background:linear-gradient(145deg,#d7a56b18,rgba(255,255,255,.025)) !important; border:1px solid #d7a56b35 !important; transition:transform .35s,border-color .35s,box-shadow .35s; }
html[data-seasonal-theme="autumn-late"] .album-card:hover { transform:translateY(-5px); border-color:#d7a56baa !important; box-shadow:0 14px 32px #d7a56b20; }
html[data-seasonal-theme="autumn-late"] .nav-link.active { background:linear-gradient(90deg,#d7a56b35,transparent) !important; color:#fff2df !important; }
html[data-seasonal-theme="autumn-late"] .nav-link.active .nav-icon { color:#d7a56b !important; }
html[data-seasonal-theme="autumn-late"] .btn-play-big,html[data-seasonal-theme="autumn-late"] .card-play-btn { background:linear-gradient(135deg,#d7a56b, #302013) !important; color:#fff2df !important; box-shadow:0 0 25px #d7a56b45; }
html[data-seasonal-theme="autumn-late"] .section-title { color:#fff2df; text-shadow:0 2px 18px #d7a56b35; }
html[data-seasonal-theme="autumn-late"] .search-wrap input:focus { border-color:#d7a56b !important; box-shadow:0 0 0 3px #d7a56b30 !important; }
#pp-theme-decor-layer { position:fixed; inset:0; z-index:20; overflow:hidden; pointer-events:none; contain:strict; }
#pp-theme-decor-layer .pp-particle { position:absolute; top:-12vh; left:calc(var(--i,1) * 5.4%); color:#d7a56b; opacity:.0; font-size:clamp(16px,2vw,30px); text-shadow:0 0 16px #d7a56b88; animation:pp-ember-fall var(--dur,13s) linear var(--delay,0s) infinite; will-change:transform,opacity; }
#pp-theme-decor-layer .pp-particle:nth-child(3n) { --i:3; --dur:17s; --delay:-7s; font-size:22px; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+1) { --i:7; --dur:12s; --delay:-3s; }
#pp-theme-decor-layer .pp-particle:nth-child(3n+2) { --i:12; --dur:20s; --delay:-12s; font-size:17px; }
#pp-theme-decor-layer .pp-particle:nth-child(4n) { --i:16; --dur:15s; --delay:-9s; }
@keyframes pp-ember-fall { 0% { transform:translate3d(0,-8vh,0) rotate(0deg) scale(.7); opacity:0; } 12% { opacity:.48; } 82% { opacity:.34; } 100% { transform:translate3d(8vw,115vh,0) rotate(340deg) scale(1.12); opacity:0; } }
html[data-seasonal-theme="autumn-late"] .main-content { animation:pp-ember-ambient 8s ease-in-out infinite alternate; }
@keyframes pp-ember-ambient { from { filter:saturate(.96); } to { filter:saturate(1.12); } }
@media(prefers-reduced-motion:reduce) { #pp-theme-decor-layer .pp-particle,html[data-seasonal-theme="autumn-late"] .main-content { animation:none !important; } html[data-seasonal-theme="autumn-late"] .album-card { transition:none !important; } }
</style></head><body><div class="pp-seasonal-atmosphere" aria-hidden="true"><span class="pp-particle p0">❧</span><span class="pp-particle p1">✧</span><span class="pp-particle p2">🍁</span><span class="pp-particle p3">❧</span><span class="pp-particle p4">✧</span><span class="pp-particle p0">🍁</span><span class="pp-particle p1">❧</span><span class="pp-particle p2">✧</span><span class="pp-particle p3">🍁</span><span class="pp-particle p4">❧</span><span class="pp-particle p0">✧</span><span class="pp-particle p1">🍁</span><span class="pp-particle p2">❧</span><span class="pp-particle p3">✧</span><span class="pp-particle p4">🍁</span><span class="pp-particle p0">❧</span><span class="pp-particle p1">✧</span><span class="pp-particle p2">🍁</span></div></body></html>
