<!-- Año Nuevo Premium: Estética dorada de lujo, fuegos artificiales avanzados, intro 10s, sin emojis -->
<style id="pp-tema-style-ano_nuevo">
html.tema-ano_nuevo {
  --accent: #f5c542; --accent-glow: rgba(245,197,66,.55);
  --bg-main: #040408; --bg-side: #090910;
  --bg-secondary: rgba(245,197,66,.15); --glass-border: rgba(245,197,66,.35);
}
html.tema-ano_nuevo body {
  background: radial-gradient(ellipse 90% 50% at 50% -10%, rgba(245,197,66,.18) 0%, transparent 60%), #040408 !important;
}
html.tema-ano_nuevo aside.sidebar {
  background: linear-gradient(180deg, rgba(245,197,66,.15) 0%, rgba(9,9,16,0.98) 130px), #090910 !important;
  border-right: 1px solid rgba(245,197,66,.35) !important;
  box-shadow: 4px 0 30px rgba(0,0,0,0.7);
}
html.tema-ano_nuevo .nav-link.active {
  background: linear-gradient(90deg, rgba(245,197,66,.3), transparent) !important;
  box-shadow: inset 4px 0 0 #f5c542, 0 4px 15px rgba(245,197,66,.25);
}
html.tema-ano_nuevo .nav-link.active .nav-icon { color: #f5c542 !important; text-shadow: 0 0 10px rgba(245,197,66,.6); }
html.tema-ano_nuevo .main-content {
  background: linear-gradient(180deg, rgba(245,197,66,.12) 0%, #040408 420px) !important;
}
html.tema-ano_nuevo .album-card {
  background: rgba(12,12,22,.8) !important; border: 1px solid rgba(245,197,66,.25);
  backdrop-filter: blur(12px);
}
html.tema-ano_nuevo .album-card:hover {
  border-color: rgba(245,197,66,.6); box-shadow: 0 16px 40px rgba(245,197,66,.28);
  transform: translateY(-6px);
}
html.tema-ano_nuevo .card-play-btn, html.tema-ano_nuevo .btn-play-big {
  background: linear-gradient(135deg, #f5c542, #d49e17) !important;
  box-shadow: 0 8px 30px rgba(245,197,66,.5) !important; color: #111 !important;
}
html.tema-ano_nuevo .player-bar {
  background: rgba(4,4,8,.96) !important; border-top: 1px solid rgba(245,197,66,.4) !important;
  backdrop-filter: blur(16px);
}
html.tema-ano_nuevo .btn-play-bar { background: #f5c542 !important; color: #111 !important; box-shadow: 0 0 20px rgba(245,197,66,.4); }
html.tema-ano_nuevo #seek-slider {
  background: linear-gradient(to right, #f5c542 var(--seek-progress), #12121e var(--seek-progress)) !important;
}
html.tema-ano_nuevo #volume-slider {
  background: linear-gradient(to right, #e8e8e8 var(--volume-progress), #12121e var(--volume-progress)) !important;
}
html.tema-ano_nuevo #auth-screen {
  background: radial-gradient(ellipse at 50% 30%, rgba(245,197,66,.22), transparent 55%), #040408 !important;
}
html.tema-ano_nuevo .auth-btn { background: linear-gradient(135deg, #f5c542, #d49e17) !important; color: #111 !important; }
html.tema-ano_nuevo #loading-screen {
  background: radial-gradient(circle at 50% 35%, rgba(245,197,66,.3), #040408 70%) !important;
}
html.tema-ano_nuevo .custom-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #f5c542, #e8e8e8) !important;
}
html.tema-ano_nuevo .pp-logo-icon,
html.tema-ano_nuevo aside.sidebar .w-8,
html.tema-ano_nuevo #auth-screen .w-10,
html.tema-ano_nuevo #loading-screen .w-10 {
  background: linear-gradient(135deg, #f5c542, #e8e8e8) !important;
  box-shadow: 0 0 25px rgba(245,197,66,.4);
}

.pp-logo-wrap { position: relative; display: inline-flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; }
.pp-logo-icon { position: relative; overflow: visible !important; transform-style: preserve-3d; }

.pp-logo-progressive-intro .pp-logo-icon {
  animation: pp-progressive-spin 10s cubic-bezier(.22, .05, .25, 1) forwards;
}

@keyframes pp-progressive-spin {
  0%   { transform: rotateY(0deg) scale(1); filter: drop-shadow(0 0 0 rgba(245,197,66,0)); }
  15%  { transform: rotateY(360deg) scale(1.08); filter: drop-shadow(0 0 10px rgba(245,197,66,0.5)); }
  40%  { transform: rotateY(1440deg) scale(1.15); filter: drop-shadow(0 0 18px rgba(232,232,232,0.7)); }
  75%  { transform: rotateY(3240deg) scale(1.2); filter: drop-shadow(0 0 22px rgba(245,197,66,0.8)); }
  92%  { transform: rotateY(4320deg) scale(1.15); filter: drop-shadow(0 0 15px rgba(232,232,232,0.6)); }
  100% { transform: rotateY(5040deg) scale(1); filter: drop-shadow(0 0 5px rgba(245,197,66,0.3)); }
}

.pp-seasonal-badge {
  position: absolute; top: -16px; right: -14px;
  transform: scale(0);
  pointer-events: none; z-index: 6;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
  transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  width: 28px; height: 28px;
}
.pp-logo-wrap.thematized .pp-seasonal-badge {
  transform: scale(1) rotate(15deg);
}

.pp-lights-overlay {
  position: fixed; top: 0; right: 0; bottom: 0;
  left: 0;
  pointer-events: none; z-index: 43;
}
.pp-light-strip {
  position: absolute; left: 16px; right: 16px; height: 20px;
}
.pp-light-strip.top { top: 6px; }
.pp-light-strip.bottom { bottom: 6px; }
.pp-light-strip svg { width: 100%; height: 20px; display: block; }

.pp-fw-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 42;
}
</style>
<script>
(function () {
  var ID = "ano_nuevo";
  var COLORS = ["#f5c542", "#e8e8e8", "#ff6b6b", "#4f46e5", "#22c55e", "#f472b6", "#38bdf8"];
  var STAR_BADGE = '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><polygon points="16,2 20,12 30,14 22,21 24,31 16,26 8,31 10,21 2,14 12,12" fill="#f5c542" stroke="#fff" stroke-width="1.5"/></svg>';

  function $(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function mark() {
    $("aside.sidebar > div.flex.items-center.gap-3, #auth-screen .auth-card > div.flex.items-center, #loading-screen > div.flex.items-center").forEach(function (el) {
      if (el.classList.contains("pp-logo-wrap")) return;
      el.classList.add("pp-logo-wrap");
      el.setAttribute("title", "Clic para animar");
      var icon = el.querySelector("div.w-8, div.w-10");
      if (icon) {
        icon.classList.add("pp-logo-icon");
        if (!icon.querySelector(".pp-seasonal-badge")) {
          var b = document.createElement("span");
          b.className = "pp-seasonal-badge";
          b.innerHTML = STAR_BADGE;
          icon.appendChild(b);
        }
      }
    });
  }

  function triggerIntroAndHold() {
    $(".pp-logo-wrap").forEach(function (w) {
      w.classList.remove("pp-logo-progressive-intro", "thematized");
      void w.offsetWidth;
      w.classList.add("pp-logo-progressive-intro");
      setTimeout(function () { w.classList.add("thematized"); }, 8500);
      setTimeout(function () { w.classList.remove("pp-logo-progressive-intro"); }, 13000);
    });
  }

  window.__ppTriggerLogoAnim = function () { triggerIntroAndHold(); };
  function bind() {
    $(".pp-logo-wrap").forEach(function (w) {
      if (w.getAttribute("data-pp-click") === "1") return;
      w.setAttribute("data-pp-click", "1");
      w.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); triggerIntroAndHold(); });
    });
  }

  function makeStripSVG(colors, count) {
    count = count || 30;
    var parts = ['<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1400 20">'];
    parts.push('<path d="M0 10 Q 175 4 350 10 T 700 10 T 1050 10 T 1400 10" fill="none" stroke="rgba(200,200,200,0.4)" stroke-width="1.5"/>');
    for (var i = 0; i < count; i++) {
      var x = 25 + (i / (count - 1)) * 1350;
      var y = 10 + Math.sin((i / (count - 1)) * Math.PI * 2) * 1.8;
      var c = colors[i % colors.length];
      var delay = (i * 0.08).toFixed(2);
      parts.push('<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+c+'">');
      parts.push('<animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="'+delay+'s" repeatCount="indefinite"/>');
      parts.push('</circle>');
    }
    parts.push('</svg>');
    return parts.join('');
  }

  function placeLights() {
    var ov = document.querySelector(".pp-lights-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.className = "pp-lights-overlay";
      document.body.appendChild(ov);
    }
    ov.innerHTML = "";
    var top = document.createElement("div");
    top.className = "pp-light-strip top";
    top.innerHTML = makeStripSVG(COLORS, 32);
    ov.appendChild(top);
    var bot = document.createElement("div");
    bot.className = "pp-light-strip bottom";
    bot.innerHTML = makeStripSVG(COLORS.slice().reverse(), 30);
    ov.appendChild(bot);
  }

  var fwCanvas = null, fwCtx = null, rockets = [], sparks = [], fwRaf = null, fwLast = 0;
  function ensureFW() {
    if (fwCanvas && fwCanvas.parentNode) return;
    fwCanvas = document.createElement("canvas");
    fwCanvas.className = "pp-fw-canvas";
    document.body.appendChild(fwCanvas);
    fwCtx = fwCanvas.getContext("2d", { alpha: true });
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      fwCanvas.width = Math.floor(window.innerWidth * dpr);
      fwCanvas.height = Math.floor(window.innerHeight * dpr);
      fwCanvas.style.width = window.innerWidth + "px";
      fwCanvas.style.height = window.innerHeight + "px";
      fwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);
  }
  function launchRocket() {
    ensureFW();
    rockets.push({
      x: window.innerWidth * (0.12 + Math.random() * 0.76),
      y: window.innerHeight + 8,
      vy: -(8 + Math.random() * 4),
      targetY: window.innerHeight * (0.1 + Math.random() * 0.35),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      trail: []
    });
  }
  function explode(x, y, color) {
    if (sparks.length > 120) return;
    var n = 20 + Math.floor(Math.random() * 12);
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.15;
      var spd = 1.8 + Math.random() * 3.8;
      sparks.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 1, decay: 0.012 + Math.random() * 0.012, color: color, size: 1.8 + Math.random() * 1.8
      });
    }
  }
  function loopFW() {
    fwRaf = requestAnimationFrame(loopFW);
    if (!fwCtx) return;
    var w = window.innerWidth, h = window.innerHeight;
    fwCtx.clearRect(0, 0, w, h);
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.y += r.vy;
      fwCtx.fillStyle = "#fff";
      fwCtx.beginPath();
      fwCtx.arc(r.x, r.y, 2.4, 0, Math.PI * 2);
      fwCtx.fill();
      if (r.y <= r.targetY) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }
    for (var j = sparks.length - 1; j >= 0; j--) {
      var p = sparks[j];
      p.x += p.vx; p.y += p.vy; p.vy += 0.048; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(j, 1); continue; }
      fwCtx.globalAlpha = Math.max(0, p.life * 0.95);
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fwCtx.fill();
    }
    fwCtx.globalAlpha = 1;
  }
  function randomLaunch() {
    if (document.hidden) return;
    var now = Date.now();
    if (now - fwLast < 550) return;
    fwLast = now;
    launchRocket();
  }
  function startFW() {
    ensureFW();
    if (fwRaf) cancelAnimationFrame(fwRaf);
    loopFW();
    if (window.__ppFWTimer) clearInterval(window.__ppFWTimer);
    window.__ppFWTimer = setInterval(randomLaunch, 1100);
  }
  function stopFW() {
    if (window.__ppFWTimer) clearInterval(window.__ppFWTimer);
    if (fwRaf) cancelAnimationFrame(fwRaf);
    rockets = []; sparks = [];
    if (fwCanvas && fwCanvas.parentNode) fwCanvas.parentNode.removeChild(fwCanvas);
  }

  window.__ppSeasonalVisDraw = function (ctx, canvas, data, api) {
    var w = canvas.width, h = canvas.height, n = 28, muestra = api.muestra, sens = api.sensitivity || 1.6;
    for (var j = 0; j < n; j++) {
      var prom = muestra(data, j, n);
      var level = Math.min(1, (prom / 255) * sens);
      var x = ((j + 0.5) / n) * w;
      var barH = Math.max(1, level * h * 0.42);
      var col = COLORS[j % COLORS.length];
      ctx.fillStyle = col;
      ctx.fillRect(x - 2, h - barH, 4, barH);
    }
    return true;
  };
  function enableVis() {
    function tryOn() {
      if (window.ProPlayerVis && window.ProPlayerVis.forceMount) { window.ProPlayerVis.forceMount(); return true; }
      return false;
    }
    if (!tryOn()) { var n=0; var iv=setInterval(function(){ if(tryOn()||++n>40) clearInterval(iv); }, 250); }
  }
  mark(); bind(); placeLights(); enableVis(); startFW();
  setTimeout(function () { triggerIntroAndHold(); }, 400);

  if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e) {}
  window.__ppLogoObserver = new MutationObserver(function () {
    mark(); bind();
  });
  window.__ppLogoObserver.observe(document.body, { childList: true, subtree: true });

  window.__ppTemaCleanup = window.__ppTemaCleanup || {};
  window.__ppTemaCleanup[ID] = function () {
    window.__ppSeasonalVisDraw = null; stopFW();
    if (window.__ppLogoObserver) try { window.__ppLogoObserver.disconnect(); } catch (e2) {}
    document.querySelectorAll(".pp-lights-overlay, .pp-fw-canvas, .pp-seasonal-badge").forEach(function (e) { e.remove(); });
  };
})();
</script>
